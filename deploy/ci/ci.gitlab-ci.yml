.dotnet_cache:
  cache:
    key:
      files:
        - global.json
        - dotnet-tools.json
      prefix: "dotnet-$CI_JOB_NAME"
    paths:
      - .nuget/packages/
    policy: pull-push

.admin_ui_cache:
  cache:
    key:
      files:
        - admin-ui/package-lock.json
      prefix: "admin-ui-$CI_JOB_NAME"
    paths:
      - .npm/
    policy: pull-push

.ci_tools_cache:
  cache:
    key:
      files:
        - deploy/ci/package-lock.json
      prefix: "ci-tools-$CI_JOB_NAME"
    paths:
      - .npm/
    policy: pull-push

ci_config_selftest:
  stage: validate
  image: node:24-bookworm-slim
  extends: .ci_tools_cache
  allow_failure: false
  script:
    - npm --prefix deploy/ci ci --no-audit --no-fund
    - npm --prefix deploy/ci run test:config

openapi_lint:
  stage: validate
  image: node:24-bookworm-slim
  extends: .ci_tools_cache
  allow_failure: false
  script:
    - npm --prefix deploy/ci ci --no-audit --no-fund
    - if [ "${CI_OPENAPI_SELFTEST_INVALID:-0}" = "1" ]; then cp deploy/ci/fixtures/openapi/invalid-openapi.yaml specs/api/openapi/ci-selftest.invalid.yaml; fi
    - npm --prefix deploy/ci run openapi:lint
    - npm --prefix deploy/ci run openapi:validate -- --summary ci-artifacts/openapi/validation-summary.txt
    - npm --prefix deploy/ci run openapi:drift
    - npm --prefix deploy/ci run test:openapi-negative
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-artifacts/openapi/

build_test_dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0.201
  services:
    - name: docker:29.6.2-dind
      alias: docker
  extends: .dotnet_cache
  allow_failure: false
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - dotnet restore Ivr.sln --locked-mode
    - dotnet build Ivr.sln --configuration Release --no-restore
    - mkdir -p ci-artifacts/dotnet/test-results ci-artifacts/dotnet/coverage
    - if [ "${CI_DOTNET_SELFTEST_FAIL:-0}" = "1" ]; then dotnet test deploy/ci/fixtures/failing-test/Ivr.CiFailingTests.csproj --configuration Release; fi
    - sh deploy/ci/scripts/selftest-dotnet-policy.sh ci-artifacts/dotnet/policy-selftest
    - dotnet test Ivr.sln --configuration Release --no-build --settings coverage.runsettings --collect:"XPlat Code Coverage" --results-directory ci-artifacts/dotnet/coverage --logger:"junit;LogFilePath=../../ci-artifacts/dotnet/test-results/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - if [ "${CI_COVERAGE_SELFTEST_LOW:-0}" = "1" ]; then dotnet run --project deploy/ci/tools/Ivr.CiPolicy/Ivr.CiPolicy.csproj --configuration Release -- coverage deploy/ci/fixtures/coverage/low 60; fi
    - dotnet run --project deploy/ci/tools/Ivr.CiPolicy/Ivr.CiPolicy.csproj --configuration Release -- coverage deploy/ci/fixtures/coverage/merge 100
    - dotnet run --project deploy/ci/tools/Ivr.CiPolicy/Ivr.CiPolicy.csproj --configuration Release -- coverage ci-artifacts/dotnet/coverage 80 --output ci-artifacts/dotnet/coverage-summary.txt
    - if [ "${CI_PII_SELFTEST_ARTIFACT:-0}" = "1" ]; then printf '123 Đường Nguyễn Huệ\n' > ci-artifacts/dotnet/pii-negative-artifact.txt; fi
  coverage: '/TOTAL_LINE_COVERAGE=(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-artifacts/dotnet/
    reports:
      junit:
        - ci-artifacts/dotnet/test-results/*-test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: ci-artifacts/dotnet/coverage/**/coverage.cobertura.xml

# W-0114 / plan §A8. The rolling-deploy schema gate.
#
# docs/owner-decisions-open.md listed "migration: new code tolerates the old schema" as the
# technical item with no gate, and deploy/ci/rollback.md §3 wrote down the other half -- migrations
# must stay compatible one step back, "và nó chưa có test nào ép". Both halves run here.
#
# Its own job rather than a line inside build_test_dotnet, because this gate answers a deployment
# question, not a code question: when it goes red the fix is usually to change how a migration is
# written, and that has to be legible in the pipeline as its own red light rather than as one of
# several hundred test failures.
#
# TreatNoTestsAsError is not decoration. Both steps select by trait, and a filter that stops
# matching -- a renamed trait, a moved file -- makes `dotnet test` exit 0 having run nothing. A
# gate that passes because it did not run is worse than no gate.
schema_compat_gate:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0.201
  services:
    - name: docker:29.6.2-dind
      alias: docker
  extends: .dotnet_cache
  allow_failure: false
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - dotnet restore Ivr.sln --locked-mode
    - mkdir -p ci-artifacts/schema-compat
    # The pair actually compared, recorded for whoever reads this pipeline months later. The tests
    # derive it themselves from the migrations assembly; this is a report, not the input.
    - ls src/Ivr.Infrastructure/Persistence/Migrations/*.cs | grep -v '\.Designer\.cs$' | sort | tail -2 > ci-artifacts/schema-compat/compared-migrations.txt
    - >
      dotnet test tests/Ivr.UnitTests/Ivr.UnitTests.csproj
      --configuration Release --filter "TestId~UT-SCHEMA"
      --logger:"junit;LogFilePath=../../ci-artifacts/schema-compat/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      -- RunConfiguration.TreatNoTestsAsError=true
    - >
      dotnet test tests/Ivr.IntegrationTests/Ivr.IntegrationTests.csproj
      --configuration Release --filter "TestId~IT-SCHEMA"
      --logger:"junit;LogFilePath=../../ci-artifacts/schema-compat/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      -- RunConfiguration.TreatNoTestsAsError=true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-artifacts/schema-compat/
    reports:
      junit:
        - ci-artifacts/schema-compat/*-test-result.xml

lint_dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0.201
  extends: .dotnet_cache
  allow_failure: false
  script:
    - dotnet restore Ivr.sln --locked-mode
    - dotnet tool restore
    - >
      dotnet nswag openapi2csclient
      /Input:specs/api/openapi/ivr-order-confirmation.v1.yaml
      /Output:src/Ivr.Contracts/Generated/IvrServer/V1/IvrServerModels.g.cs
      /Namespace:Ivr.Contracts.Generated.IvrServer.V1
      /ClassName:IvrServerV1Client
      /GenerateClientClasses:false
      /GenerateDtoTypes:true
      /JsonLibrary:SystemTextJson
      /JsonLibraryVersion:10.0
      /GenerateNullableReferenceTypes:true
      /GenerateOptionalPropertiesAsNullable:true
      /UseRequiredKeyword:true
      /WriteAccessor:init
      /NewLineBehavior:LF
    - >
      dotnet nswag openapi2csclient
      /Input:specs/api/openapi/order-core-ivr-callback.target-v1.yaml
      /Output:src/Ivr.Contracts/Generated/SalesTarget/V1/SalesTargetV1Client.g.cs
      /Namespace:Ivr.Contracts.Generated.SalesTarget.V1
      /ClassName:SalesTargetV1Client
      /GenerateClientClasses:true
      /GenerateClientInterfaces:true
      /InjectHttpClient:true
      /DisposeHttpClient:false
      /UseBaseUrl:true
      /GenerateBaseUrlProperty:true
      /OperationGenerationMode:SingleClientFromOperationId
      /JsonLibrary:SystemTextJson
      /JsonLibraryVersion:10.0
      /GenerateNullableReferenceTypes:true
      /GenerateOptionalPropertiesAsNullable:true
      /UseRequiredKeyword:true
      /WriteAccessor:init
      /NewLineBehavior:LF
    - git diff --exit-code -- src/Ivr.Contracts/Generated
    - dotnet format Ivr.sln --no-restore --verify-no-changes --verbosity diagnostic
    - dotnet build Ivr.sln --configuration Release --no-restore -p:RunAnalyzers=true

build_lint_ui:
  stage: build
  image: node:24-bookworm-slim
  extends: .admin_ui_cache
  allow_failure: false
  script:
    - npm --prefix admin-ui ci --no-audit --no-fund
    - npm --prefix admin-ui run lint
    - npm --prefix admin-ui run typecheck
    # P3-1 (W-0025) added the suite; it is mandatory, not conditional.
    - npm --prefix admin-ui test
    - npm --prefix admin-ui run build
    - mkdir -p ci-artifacts/ui
    - printf 'admin-ui lint=PASS\nadmin-ui typecheck=PASS\nadmin-ui tests=PASS\nadmin-ui production-build=PASS\n' > ci-artifacts/ui/summary.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-artifacts/ui/

security_scan:
  stage: security
  image: mcr.microsoft.com/dotnet/sdk:10.0.201
  extends: .dotnet_cache
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
    GITLEAKS_VERSION: "8.30.0"
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl nodejs npm
  script:
    - sh deploy/ci/scripts/security-scan.sh

pii_scan:
  stage: privacy
  image: debian:bookworm-slim
  allow_failure: false
  variables:
    LC_ALL: "C.UTF-8"
  needs:
    - job: build_test_dotnet
      artifacts: true
    - job: build_lint_ui
      artifacts: true
    - job: openapi_lint
      artifacts: true
    # W-0114. Every job that publishes an artifact is scanned, without exception: the artefact
    # here names migration files, but the invariant is that nothing reaches the artifact store
    # unread, and an exemption is how that stops being true.
    - job: schema_compat_gate
      artifacts: true
  script:
    - sh deploy/ci/scripts/selftest-pii.sh
    - sh deploy/ci/scripts/scan-pii.sh docs/evidence ci-artifacts
