# W-0045 / P7-3 §6.5 — the two environments a human has to press a button for.
#
# Never run. No runner, no cluster credential, no protected environment exists yet (W-0061 /
# W-0063). Shape asserted by cd-selftest.mjs; execution NOT_RUN.
#
# `when: manual` is the mechanism; it is not the whole gate. GitLab's protected environments decide
# WHO may press it, and that is configuration in the project, not in this file -- so this file
# cannot claim four-eyes on its own. Recorded in docs/evidence/W-0045 rather than implied here.
#
# Nothing in this file sets REAL_CUSTOMER_CALL_ALLOWED. Promotion moves an artifact between
# environments; opening real calling is a separate admin action with its own permission, audit and
# four-eyes (specs/api/03-admin-api.md), gated on a DF-03 sign-off that does not exist. A pipeline
# that could flip it would make the sign-off decorative.

.promote_base: &promote_base
  image: alpine/helm:3.16.3
  stage: promote
  # A promotion gate that may fail is not a gate (P7-3 §11).
  allow_failure: false
  when: manual
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        echo "promotion failed; rolling back $HELM_RELEASE in $KUBE_NAMESPACE"
        helm rollback "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" --wait --timeout 5m || true
        helm history "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" --max 5 || true
      fi

promote_lab:
  <<: *promote_base
  environment:
    name: lab
    deployment_tier: staging
  resource_group: lab
  variables:
    KUBE_NAMESPACE: ivr-lab
    HELM_RELEASE: ivr
  needs:
    - job: deploy_staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    # The lab ladder step requires a real SIM and an allowlist, neither of which exists (W-0008).
    # Checked here rather than assumed, so a lab promotion cannot quietly become a lab run.
    - |
      if [ "${IVR_EXECUTION_MODE:-MOCK}" != "MOCK" ]; then
        echo "lab promotion refused: IVR_EXECUTION_MODE=$IVR_EXECUTION_MODE but no SIM gateway is procured (W-0008)."
        exit 1
      fi
    - |
      helm upgrade --install "$HELM_RELEASE" deploy/helm/ivr \
        --namespace "$KUBE_NAMESPACE" --create-namespace \
        --values deploy/helm/ivr/values-lab.yaml \
        --set image.registry="$CI_REGISTRY_IMAGE" \
        --set image.tag="0.1.0-$CI_COMMIT_SHORT_SHA" \
        --atomic --wait --timeout 10m
    - kubectl -n "$KUBE_NAMESPACE" rollout status deploy/ivr-ivr-api --timeout=5m

promote_prod:
  <<: *promote_base
  environment:
    name: production
    deployment_tier: production
  resource_group: production
  variables:
    KUBE_NAMESPACE: ivr-prod
    HELM_RELEASE: ivr
  needs:
    - job: promote_lab
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    # DF-03 is a sign-off, not a variable. The job refuses to run while the recorded decision is
    # still open, so pressing the button early fails loudly instead of deploying quietly.
    - |
      if [ "${IVR_DF03_SIGNOFF_REF:-}" = "" ]; then
        echo "production promotion refused: no DF-03 sign-off reference supplied."
        exit 1
      fi
    - |
      if [ "${IVR_EXECUTION_MODE:-MOCK}" != "MOCK" ]; then
        echo "production promotion refused: IVR_EXECUTION_MODE=$IVR_EXECUTION_MODE. Opening a non-MOCK mode is an admin action with its own four-eyes, not a deployment."
        exit 1
      fi
    - |
      helm upgrade --install "$HELM_RELEASE" deploy/helm/ivr \
        --namespace "$KUBE_NAMESPACE" --create-namespace \
        --values deploy/helm/ivr/values-prod.yaml \
        --set image.registry="$CI_REGISTRY_IMAGE" \
        --set image.tag="0.1.0-$CI_COMMIT_SHORT_SHA" \
        --atomic --wait --timeout 10m
    - kubectl -n "$KUBE_NAMESPACE" rollout status deploy/ivr-ivr-api --timeout=5m
    - |
      helm get values "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" -o yaml > ci-artifacts/cd/prod-effective-values.yaml
      grep -q 'realCustomerCallAllowed: false' ci-artifacts/cd/prod-effective-values.yaml
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - ci-artifacts/cd/

rollback_prod:
  <<: *promote_base
  environment:
    name: production
    deployment_tier: production
    action: prepare
  resource_group: production
  variables:
    KUBE_NAMESPACE: ivr-prod
    HELM_RELEASE: ivr
  needs:
    - job: promote_prod
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  script:
    # Same resource_group as the deploy it undoes: a rollback racing an in-flight upgrade is how a
    # release ends up at a revision nobody chose.
    - helm history "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" --max 10
    - helm rollback "$HELM_RELEASE" "${IVR_ROLLBACK_REVISION:-0}" --namespace "$KUBE_NAMESPACE" --wait --timeout 10m
    - kubectl -n "$KUBE_NAMESPACE" rollout status deploy/ivr-ivr-api --timeout=5m
