{{- include "ivr.assertLadder" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ivr.fullname" . }}-worker
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    # The DT-04 ceiling, recorded where an operator scaling this will actually see it.
    ivr.ginsengfood/sim-pool-size: {{ .Values.worker.hpa.simPoolSize | quote }}
    ivr.ginsengfood/scaling-note: >-
      One SIM carries one call. Replicas beyond the SIM pool cannot dial more calls; the scheduler
      advisory lock (P2-3) makes the extra pods contend for the same leases instead of
      double-dispatching. Raising maxReplicas without raising the SIM pool buys nothing.
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ivr.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "ivr.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ include "ivr.image" . }}ivr-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "ivr.governanceEnv" . | nindent 12 }}
            {{- include "ivr.dbEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: health
              containerPort: {{ .Values.worker.health.port }}
              protocol: TCP
          # There IS something to measure now (W-0043 §2). It used to say "the worker opens no
          # socket at all", which was true and left the real failure invisible: every job loop
          # catches its own exceptions and keeps polling, so a loop failing forever -- or hanging
          # inside a call that never returns -- looks exactly like a healthy one. The process does
          # not exit, so the only signal Kubernetes had never fired.
          #
          # LIVENESS ONLY, deliberately. The endpoint reports 503 when a loop that was meant to be
          # running has STOPPED, which a restart repairs. It reports 200 while loops are turning
          # but failing, because restarting does not repair a dependency -- it would add a restart
          # storm to an outage, at the worst possible moment. And it reports 200 for a worker whose
          # loops are all configured off, because a restart cannot start those either.
          #
          # No readinessProbe: nothing routes traffic to the worker, so "ready" has no meaning here
          # and adding one would only invent a second thing to be wrong about.
          livenessProbe:
            httpGet:
              path: {{ .Values.worker.health.path }}
              port: health
            # Loops register as they start. Probing before they have is the one window where the
            # endpoint honestly reports stalled, so the delay is not padding -- it is the length of
            # startup.
            initialDelaySeconds: {{ .Values.worker.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.health.periodSeconds }}
            # Three consecutive failures, not one. The staleness threshold inside the worker is
            # already three poll intervals; requiring three probe failures on top means a restart
            # follows a loop that has genuinely stopped, not one slow moment observed twice.
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
