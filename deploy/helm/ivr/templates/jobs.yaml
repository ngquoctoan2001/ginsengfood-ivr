# W-0044 / P7-2 — the migration hook and the retention CronJob.
#
# The migration Job exists because W-0043 found that nothing applies migrations: on a fresh database
# the worker died on a missing table and readiness had only ever looked green because an old volume
# still carried the schema. A pre-install/pre-upgrade hook is the Kubernetes shape of the one-shot
# job the compose stack needed -- and a hook, not an initContainer, because several API replicas
# racing to apply the same migration is a known way to damage a schema.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ivr.fullname" . }}-migrate
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ivr.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # No serviceAccountName, unlike every other pod in this chart, and that is forced rather than
      # chosen. This Job is a `pre-install` hook: Helm runs it BEFORE the release's own resources
      # exist, so the ServiceAccount it would name has not been created yet and the Job cannot
      # start at all -- `serviceaccount "ivr-ivr" not found`, retrying until the install times out.
      #
      # It never showed up because a fresh `helm install` had never been exercised: the selftest
      # applied the whole render in one `kubectl apply`, where the account arrives in the same batch
      # and the Job's retries outlast the gap. IT-K8S-WORKER-06's ordered deploy is what made the
      # harness install in the order Helm actually does.
      #
      # The account existed so pods would not inherit `default` and its token. The token is what
      # mattered, and this keeps it: no token is mounted either way.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ include "ivr.image" . }}ivr-migrate:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--connection"
            - "Host={{ .Values.database.host }};Port={{ .Values.database.port }};Database={{ .Values.database.name }};Username={{ .Values.database.user }};Password=$(IVR_DB_PASSWORD)"
          env:
            - name: IVR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretPasswordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- if .Values.retention.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ivr.fullname" . }}-retention
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention
  annotations:
    ivr.ginsengfood/decision: DF-07
    ivr.ginsengfood/run-once-note: >-
      Ivr__Retention__RunOnce makes the worker perform one pass and stop the host. Without it the
      pod never exits -- the scheduler, normalisation and callback hosts keep the process alive --
      and Kubernetes records the Job as failed, which is what W-0044 hit the first time this was
      scheduled.
    ivr.ginsengfood/dry-run-note: >-
      Deleting customer data on a schedule is the one job where a wrong default cannot be undone, so
      the default reports what it would delete and deletes nothing. Turning it off is an operational
      decision with an approval behind it, not a values tweak.
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "ivr.labels" . | nindent 12 }}
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "ivr.fullname" . }}
          securityContext:
            runAsNonRoot: true
          containers:
            - name: retention
              image: "{{ include "ivr.image" . }}ivr-worker:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                # The real configuration keys. An earlier draft invented IVR_RETENTION_* names that
                # the application silently ignored -- the job "ran" and configured nothing, which is
                # the failure mode a retention job must never have.
                - name: Ivr__Retention__Enabled
                  value: "true"
                - name: Ivr__Retention__RunOnce
                  value: "true"
                - name: Ivr__Retention__DryRun
                  value: {{ .Values.retention.dryRun | quote }}
                {{- include "ivr.governanceEnv" . | nindent 16 }}
                {{- include "ivr.dbEnv" . | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
{{- end }}
{{- if .Values.backup.enabled }}
{{- if not .Values.backup.image }}
{{- fail "backup.enabled is true but backup.image is empty. A backup job that cannot run is worse than no backup job: it teaches operators to ignore failed Jobs." }}
{{- end }}
{{- if not .Values.backup.existingSecret }}
{{- fail "backup.enabled is true but backup.existingSecret is empty. The master key must come from a secret store; the chart references, it never carries." }}
{{- end }}
{{- if not .Values.backup.destination }}
{{- fail "backup.enabled is true but backup.destination is empty. A backup written to the pod filesystem disappears with the pod." }}
{{- end }}
{{- if gt (int .Values.backup.maxAgeDays) 3650 }}
{{- fail "backup.maxAgeDays exceeds ten years. Backup age is a retention period (DF-07); it must not outlive the data it copies." }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ivr.fullname" . }}-backup
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    ivr.ginsengfood/decision: DF-07
    ivr.ginsengfood/encryption-note: >-
      deploy/backup/backup.sh pipes pg_dump straight into the cipher, so no plaintext dump ever
      reaches a filesystem, and authenticates with encrypt-then-MAC so a tampered artefact is
      refused before a byte of it is decrypted. It refuses to run at all if openssl is missing
      rather than falling back to writing plaintext.
    ivr.ginsengfood/prune-note: >-
      Backup age is a retention period. A 90-day backup of a 30-day table means the real period is
      90 days and the number 30 is a description, so prune.sh runs in the same job and defaults to
      dry run like the retention job it mirrors.
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "ivr.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "ivr.fullname" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: backup
              image: {{ .Values.backup.image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  /scripts/backup.sh &&
                  IVR_BACKUP_DRY_RUN={{ .Values.backup.dryRunPrune }} /scripts/prune.sh
              env:
                - name: IVR_BACKUP_DIR
                  value: {{ .Values.backup.destination | quote }}
                - name: IVR_BACKUP_MAX_AGE_DAYS
                  value: {{ .Values.backup.maxAgeDays | quote }}
                - name: IVR_BACKUP_KEY_FILE
                  value: "/secrets/{{ .Values.backup.keyFileKey }}"
                - name: PGHOST
                  value: {{ .Values.database.host | quote }}
                - name: PGPORT
                  value: {{ .Values.database.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.database.name | quote }}
                - name: PGUSER
                  value: {{ .Values.database.user | quote }}
                - name: PGSSLMODE
                  value: {{ eq (.Values.database.sslMode | default "Require") "Disable" | ternary "disable" "require" }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.existingSecret }}
                      key: {{ .Values.database.existingSecretPasswordKey }}
              volumeMounts:
                - name: backup-key
                  mountPath: /secrets
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: backup-key
              secret:
                secretName: {{ .Values.backup.existingSecret }}
                defaultMode: 0400
{{- end }}
