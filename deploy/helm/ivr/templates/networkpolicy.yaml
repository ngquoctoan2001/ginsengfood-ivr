{{- if .Values.networkPolicy.enabled }}
# W-0044 / P7-2 §4 — least-privilege egress.
#
# Default-deny first, then name what may leave. The order matters for a reader: a policy that opens
# holes in a permissive default reads the same as one that opens holes in a closed default, and only
# the second is least privilege.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-default-deny
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-egress
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    # DNS is listed on its own because a policy that forgets it breaks every rule below in a way
    # that looks like the wrong rule: names stop resolving, and the symptom points at the database.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.databasePort }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.otelPort }}
    # The console calling the API, which the ingress policy already permits from the other side.
    # NetworkPolicy needs BOTH ends to agree, and only one of them did: the console renders
    # server-side against http://<release>-api:8080, so in any cluster that enforces policy the
    # console could not load a page. IT-K8S-NETPOL-04 missed it because it only ever tested egress
    # to the INTERNET -- a rule that is supposed to be denied. Nothing tested a hop that is supposed
    # to work, and a policy suite that only checks its refusals will always pass.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ivr.name" . }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
    {{- range .Values.networkPolicy.egress.external }}
    # {{ .name }} — an owner-supplied destination, never a wildcard.
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-ingress
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    # Only the console reaches the API. Nothing else in the namespace has a reason to.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ivr.name" . }}
              app.kubernetes.io/component: ui
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
