{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.networkPolicy.ingress.module3.enabled (or (empty .Values.networkPolicy.ingress.module3.namespaceLabels) (empty .Values.networkPolicy.ingress.module3.podLabels)) }}
{{- fail "networkPolicy.ingress.module3 requires non-empty namespaceLabels and podLabels" }}
{{- end }}
# W-0044 / P7-2 §4 — least-privilege egress.
#
# Default-deny first, then name what may leave. The order matters for a reader: a policy that opens
# holes in a permissive default reads the same as one that opens holes in a closed default, and only
# the second is least privilege.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-default-deny
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-egress
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    # DNS is listed on its own because a policy that forgets it breaks every rule below in a way
    # that looks like the wrong rule: names stop resolving, and the symptom points at the database.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.databasePort }}
    {{- if .Values.observability.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.observability.collector.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.observability.collector.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.observability.port }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.external }}
    # {{ .name }} — an owner-supplied destination, never a wildcard.
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-ingress
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  {{- if or .Values.networkPolicy.ingress.module3.enabled .Values.worker.eligibilityPolling.enabled }}
  ingress:
    {{- if .Values.networkPolicy.ingress.module3.enabled }}
    # Module 3's BFF is the only admin caller. Both selectors are owner/platform supplied.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.module3.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingress.module3.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.worker.eligibilityPolling.enabled }}
    # W-0360 / K-34. This release's own worker, for the eligibility loop and nothing wider.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ivr.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- if .Values.worker.eligibilityPolling.enabled }}
---
# W-0360 / K-34. The other half of the same path: the worker may leave for this release's API on
# its HTTP port. A separate policy rather than a rule in the shared egress policy above, which
# selects every pod of the release and would hand the same path to the API pods too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ivr.fullname" . }}-worker-to-api
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ivr.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "ivr.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
