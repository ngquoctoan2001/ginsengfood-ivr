apiVersion: v1
kind: Service
metadata:
  name: {{ include "ivr.fullname" . }}-api
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "ivr.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ivr.fullname" . }}
  labels:
    {{- include "ivr.labels" . | nindent 4 }}
# No RoleBinding: neither deployable talks to the Kubernetes API. The account exists so
# the pods do not inherit `default`, which in many clusters carries more than it should.
automountServiceAccountToken: false
