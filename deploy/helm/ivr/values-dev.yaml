# W-0044 / P7-2 — dev
#
# Ladder floor. MOCK only, no real calling, and nothing here may widen either.
governance:
  environmentName: dev
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true

# W-0053 / P10-2. The only environment permitted to skip TLS to the database, and only because
# the throwaway bootstrap PostgreSQL in ci/bootstrap-dev.yaml ships no certificate. Written here
# rather than inherited silently, so the exception is visible where the exception is taken.
database:
  sslMode: Disable

image:
  tag: "0.1.0-dev"

api:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    simPoolSize: 4

networkPolicy:
  ingress:
    # CI/dev contract probe standing in for the Module 3 BFF. Deployed environments must replace
    # these labels with the platform-owned identity before enabling their ingress.
    module3:
      enabled: true
      namespaceLabels:
        kubernetes.io/metadata.name: ivr-dev
      podLabels:
        app.kubernetes.io/name: module3
        app.kubernetes.io/component: bff

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
