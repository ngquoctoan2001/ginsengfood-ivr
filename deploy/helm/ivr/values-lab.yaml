# W-0044 / P7-2 — lab
#
# Lab. Still MOCK: no gateway has been procured, so LAB_REAL_SIM has nothing to dial.
governance:
  environmentName: lab
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true
  # LAB_REAL_SIM is the mode this env is BUILT for, and it stays MOCK until the SIM gateway
  # exists (W-0008, still BLOCKED_EXTERNAL). The allowlist below is what LAB_REAL_SIM would need:
  # helm template FAILS if the mode is switched without it, so the two can never separate.
  labDestinationAllowlist: []
# W-0053 / P10-2. TLS required. trustServerCertificate stays true until the cluster has a
# trusted CA for its database (W-0063): encryption without validation stops passive
# eavesdropping and not a machine in the middle, so this is a stated gap, not a setting.
database:
  sslMode: Require
  trustServerCertificate: true

image:
  tag: "0.1.0-lab"

api:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    simPoolSize: 12

ui:
  replicas: 2

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
