# SUPERSEDED — ĐÃ THAY THẾ, 26/09 (W-0363 / K-50). N1, luật quá độ Tech Lead chốt 24/09: production
# không tổng hợp giọng lúc gọi, chỉ phát audio dựng sẵn (VieNeu render offline, Q-29). Chart từ chối
# worker.tts.enabled ở production kể cả khi ứng viên đủ mọi ô, nên file này không còn đường nào để
# dùng. Giữ lại làm lịch sử của W-0122 và W-0317; speech-transition-gate.mjs kiểm dấu này.
#
# NHÁP — cấu hình production cho VieNeu-TTS. W-0317, Lô 4 bước 4 của
# plan/ivr-orther/vuong-mac-va-quyet-dinh-2026-09-17.md.
#
# KHÔNG deploy file này như hiện có. values-prod.yaml vẫn đặt worker.tts.enabled: false, và không gate
# nào đọc file này (mọi gate đọc values-<môi trường>.yaml theo tên).
#
# File ghi sẵn mọi thứ đã biết hôm nay và để TRỐNG đúng những ô còn chờ. Render nó hôm nay thì chart
# TỪ CHỐI — đó là thiết kế fail-closed của W-0122, không phải lỗi:
#
#   helm template ivr deploy/helm/ivr -f deploy/helm/ivr/values-prod.yaml \
#     -f deploy/helm/ivr/values-prod-tts.draft.yaml
#
# Ô còn trống, và ai điền (docs/evidence/W-0317/README.md §4 có lượt render chứng minh danh sách này đủ):
#
#   governance.executionMode=PRODUCTION_REAL  — ngày gọi khách thật; không riêng gì TTS
#   image.repository / image.digest           — S5: kho bản cài nội bộ, và Trivy chạy lại trên chính digest đó
#   modelBundle.existingClaim                 — S5: bundle từ mirror nội bộ (OD-VOICE-07)
#   mediaSink                                  — S5: chỗ đặt audio sinh ra cho tổng đài đọc (OD-VOICE-08)
#   approvals.legalRef đã ghi W-0343           — phê duyệt Legal/Privacy đã nhận; không phải bật production
#   approvals.platformRef                     — S5: máy chạy thật
#   approvals.telephonyRef                    — S6: nhà mạng và adapter production
#   approvals.internalMirrorRef               — S5: OD-VOICE-07
#   resources                                 — S5: đo trên máy thật (mỗi câu ≤ 5 giây, dư 20% trước lúc quay)
#
# ConfigMap nghiệm thu giọng — tạo từ đúng một nguồn, không chép tay nội dung vào đây:
#
#   kubectl -n <namespace> create configmap ivr-tts-voice-acceptance \
#     --from-file=voice-acceptance-manifest.json=docs/evidence/W-0343/voice-acceptance-manifest.json
#
# Manifest đó là OWNER_ACCEPTED (OD-VOICE-06, 28/08). Nó ràng vào hash của MODELS.lock và của
# deploy/tts/runtime-requirements.lock. W-0343 thêm phê duyệt vào metadata W-0342 và ghi chuyển
# liên kết ở README W-0343; model/preset/audio không đổi, giữ quyết định nghe đã có.
#
# Owner đã chốt ba giọng và các đoạn/mối nối; không yêu cầu nghe lại cho W-0343. Catalog lấy từ
# deploy/lab/asterisk/audio/segments-appsettings.json; tiền tố "sound:generated/" là mặc định của chart
# (mediaSink.mediaReferencePrefix) và đổi theo chỗ đặt audio mà S5 chọn.

