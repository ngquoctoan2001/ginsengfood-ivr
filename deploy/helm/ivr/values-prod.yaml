# W-0044 / P7-2 — prod
#
# Production. Still MOCK and still no real calling: DF-03 has not been signed off.
governance:
  environmentName: prod
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true
  # PRODUCTION_REAL is the only mode prod may eventually carry, and realCustomerCallAllowed
  # stays FALSE here until a DF-03 sign-off exists. Nobody may flip it by editing this file: the
  # render-time guard permits true only for lab and prod, and the sign-off is a separate gate.
# W-0053 / P10-2. TLS required AND the certificate validated. The render guard refuses
# trustServerCertificate here, so shipping prod without a trusted CA is a failed deploy
# rather than a quietly weaker connection.
database:
  sslMode: Require
  trustServerCertificate: false

image:
  tag: "0.1.0"

api:
  replicas: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    simPoolSize: 32
  # W-0122 stays fail-closed until OD-VOICE-06/07/08, G-LEGAL/G-PLATFORM/G-DIAL/G-ESIM32,
  # internal mirror and target-hardware evidence are all supplied.
  tts:
    enabled: false

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
