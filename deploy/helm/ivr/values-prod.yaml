# W-0044 / P7-2 — prod
#
# Production. Still MOCK and still no real calling: DF-03 has not been signed off.
governance:
  environmentName: prod
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true
  # PRODUCTION_REAL is the only mode prod may eventually carry, and realCustomerCallAllowed
  # stays FALSE here until a DF-03 sign-off exists. Nobody may flip it by editing this file: the
  # render-time guard permits true only for pilot and prod, and the sign-off is a separate gate.
image:
  tag: "0.1.0"

api:
  replicas: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 8

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    simPoolSize: 32

ui:
  replicas: 2

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
