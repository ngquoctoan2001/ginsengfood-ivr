# W-0044 / P7-2 — staging
#
# Same ladder position as dev. Staging is where load is rehearsed, not where the mode opens.
governance:
  environmentName: staging
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true

image:
  tag: "0.1.0-staging"

api:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    simPoolSize: 8

ui:
  replicas: 2

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
