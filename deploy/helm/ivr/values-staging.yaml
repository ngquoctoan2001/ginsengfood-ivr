# W-0044 / P7-2 — staging
#
# Same ladder position as dev. Staging is where load is rehearsed, not where the mode opens.
governance:
  environmentName: staging
  realCustomerCallAllowed: false
  executionMode: MOCK
  adapterMode: MOCK
  killSwitchEnabled: true

# W-0053 / P10-2. TLS required. trustServerCertificate stays true until the cluster has a
# trusted CA for its database (W-0063): encryption without validation stops passive
# eavesdropping and not a machine in the middle, so this is a stated gap, not a setting.
database:
  sslMode: Require
  trustServerCertificate: true

image:
  tag: "0.1.0-staging"

observability:
  # Staging exports every root trace once Platform supplies an endpoint/credential overlay.
  traceSamplingRatio: 1.0

api:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    simPoolSize: 8

retention:
  enabled: true
  schedule: "30 2 * * *"
  dryRun: true
