# W-0044 / P7-2 — defaults.
#
# Every default here is the SAFE end of the governance ladder. An environment that forgets to set a
# value gets the closed position, never the open one: a values file is a thing people copy, and a
# copy that silently opens real calling is the one mistake this chart must make impossible.

nameOverride: ""

image:
  registry: ""
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# --- Governance ladder (README-governance section 6) --------------------------------------------
governance:
  # NEVER true in this file. P7-2 section 11 forbids it outside prod/lab, and prod only after a
  # DF-03 sign-off that does not exist yet.
  realCustomerCallAllowed: false
  # Canonical key. The ENVIRONMENT does not decide this -- an env values file may narrow it, never
  # widen it beyond what the ladder allows for that env.
  executionMode: MOCK
  adapterMode: MOCK
  # Non-empty only for lab: the destinations a LAB_REAL_SIM run may dial.
  labDestinationAllowlist: []
  killSwitchEnabled: true

api:
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 1000m, memory: 512Mi }

worker:
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    # Ceiling, not a preference. One SIM carries one call (DT-04), so worker throughput is bounded
    # by the SIM pool and not by pod count. Extra replicas cannot dial more calls; the scheduler's
    # advisory lock (P2-3) makes them contend for the same leases instead. Raising this without
    # raising the SIM pool buys nothing and costs contention.
    maxReplicas: 2
    simPoolSize: 12
  health:
    # A port nothing else uses, on a component that had no listening socket until W-0043 §2. The
    # NetworkPolicy default-deny still applies to pod-to-pod traffic here: kubelet probes originate
    # from the node, which is why IT-K8S-WORKER-06 measures the probe on a real cluster rather than
    # taking that on trust.
    port: 8081
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 15
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  # W-0122 production candidate. Off by default and guarded at Helm render time. Lab uses the
  # explicit docker-compose.vieneu-tts.yml overlay; this block must never be enabled merely to
  # reproduce a laptop test.
  tts:
    enabled: false
    image:
      # Exact internal repository plus sha256 digest; tags are deliberately unsupported here.
      repository: ""
      digest: ""
      pullPolicy: IfNotPresent
    port: 8090
    modelBundle:
      # Pre-populated from the owner-approved internal mirror. The chart performs no model fetch.
      existingClaim: ""
      lockSha256: ""
      mountPath: /models
    voiceAcceptance:
      # ConfigMap data must contain the completed Owner artifact. The chart references it; the
      # pending template and synthetic CI fixture carry no approval authority.
      existingConfigMap: ""
      key: voice-acceptance-manifest.json
      mountPath: /run/ivr-tts/voice-acceptance-manifest.json
    mediaSink:
      # Current chart supports only a shared RWX PVC because the telephony consumer is not in this
      # Pod. Co-locating that consumer is a separate topology change under OD-VOICE-08.
      type: UNDECIDED
      existingClaim: ""
      mountPath: /var/lib/ivr/speech
      mediaReferencePrefix: "sound:generated/"
    approvals:
      legalRef: ""
      platformRef: ""
      telephonyRef: ""
      internalMirrorRef: ""
      voiceAcceptanceRef: ""
      # Required only to raise timeoutMilliseconds above the accepted worker baseline. Name the
      # target-hardware measurement, not an intention to measure later.
      performanceRef: ""
    # Per-provider-request timeout, kept at the accepted worker baseline. The three dynamic
    # segments of a cold playlist are synthesised sequentially before dial, so the chart budgets
    # dynamicSegmentsPerCall x timeoutMilliseconds against the pre-dial window and refuses to
    # render without the 20% headroom W-0122 §4.6 requires. Raising this is not a substitute for
    # capacity: §4.6 says reduce concurrency or add capacity, not lengthen the timeout.
    timeoutMilliseconds: 5000
    dynamicSegmentsPerCall: 3
    # Scheduler lease (120 s) minus the expected call duration (60 s) in the accepted worker
    # appsettings. Pre-dial synthesis may consume this window, not the whole lease.
    preDialBudgetMilliseconds: 60000
    maxConcurrency: 1
    maxTextChars: 1200
    maxDurationSeconds: 120
    requestBodyTemplate: >-
      {"text":"{{text}}","voice_id":"{{voice_id}}","locale":"{{locale}}","speaking_rate":{{speaking_rate}},"output_format":"{{output_format}}","sample_rate":{{sample_rate}}}
    resources:
      # Placeholders remain intentionally empty until target-hardware measurement is approved.
      requests: {}
      limits: {}
    voices:
      North: { voiceId: "", speakingRate: 1.0, fixedSegments: [] }
      Central: { voiceId: "", speakingRate: 1.0, fixedSegments: [] }
      South: { voiceId: "", speakingRate: 1.0, fixedSegments: [] }

ui:
  # W-0128. The Next.js directory is a reference implementation only. Module 3 owns and deploys
  # operator identity and UI; the chart refuses true rather than shipping a credential-bearing UI.
  enabled: false

database:
  host: ivr-postgres
  port: 5432
  name: ivr
  user: ivr
  # Never a literal. The chart references a Secret; it does not carry one.
  existingSecret: ivr-database
  existingSecretPasswordKey: password
  # W-0053 / P10-2 section 6. Before this existed the connection string carried no SSL Mode at
  # all, so Npgsql applied its default of Prefer: try TLS, and fall back to plaintext in silence
  # if the server does not offer it. A misconfigured server produced an unencrypted connection
  # with no error, no log and no warning.
  #
  # Require is the floor. Only dev may set Disable, and only because the throwaway bootstrap
  # PostgreSQL has no certificate; ivr.assertDatabaseTls fails the render anywhere else.
  sslMode: Require
  # Encryption without authentication stops passive eavesdropping and nothing else. Permitted
  # while a cluster has no trusted CA for its database; refused in prod.
  trustServerCertificate: false

secrets:
  # P7-2 section 4: K8s Secret in dev, external store in prod. Either way the chart REFERENCES.
  existingSecret: ivr-app-secrets
  internalServiceTokenKey: internal-service-token
  orderCoreServiceTokenKey: order-core-service-token
  adminReadTokenKey: admin-read-token
  adminWriteTokenKey: admin-write-token
  adminDangerTokenKey: admin-danger-token
  # Rotation, both empty unless one is in progress. Setting the key alone is not enough and that is
  # deliberate: OrderCoreCredentialSource ignores a previous token with no retirement instant, so a
  # half-filled rotation fails closed to "one credential" instead of quietly opening a second one
  # with no end date.
  orderCoreServiceTokenPreviousKey: ""
  orderCoreServiceTokenPreviousRetiresAt: ""
  # Optional bounded admin-tier overlaps. A key requires its matching absolute retirement instant.
  adminReadTokenPreviousKey: ""
  adminReadTokenPreviousRetiresAt: ""
  adminWriteTokenPreviousKey: ""
  adminWriteTokenPreviousRetiresAt: ""
  adminDangerTokenPreviousKey: ""
  adminDangerTokenPreviousRetiresAt: ""

retention:
  # W-0047 closed the run-once gap, so the CronJob can complete and is enabled again.
  enabled: true
  schedule: "30 2 * * *"
  # DF-07. Deleting customer data on a schedule is the one job where a wrong default is
  # unrecoverable, so the default reports what it WOULD delete and deletes nothing.
  dryRun: true

# W-0053 / P10-2. Backup CronJob, off in every environment, and the reason is not caution.
#
# The job needs three things that do not exist: an image carrying both pg_dump and openssl, a
# durable destination outside the cluster, and a master key from a secret store (W-0063). Shipping
# it enabled would leave a permanently failing CronJob in every namespace, which is how operators
# learn to ignore failed Jobs -- the lesson W-0044 already paid for once.
#
# The scripts themselves are real and drilled: deploy/backup/*.sh run in DG-BACKUP-02 against real
# PostgreSQL every pipeline. What is missing is somewhere to put the result.
backup:
  enabled: false
  schedule: "0 1 * * *"
  # Must never exceed the longest configured retention period, or the backup becomes the real
  # retention period and the configured one becomes a description (DF-07).
  maxAgeDays: 30
  dryRunPrune: true
  # Image and secret are named but not defaulted: a placeholder that happens to resolve is worse
  # than a value that fails loudly.
  image: ""
  existingSecret: ""
  keyFileKey: "backup-master-key"
  destination: ""

networkPolicy:
  enabled: true
  # Least privilege: everything not named here is denied. DNS is separate because a policy that
  # forgets it breaks every egress rule below it in a way that looks like the wrong rule.
  allowDns: true
  ingress:
    # Fail-closed until the platform supplies Module 3's real namespace/pod labels.
    module3:
      enabled: false
      namespaceLabels: {}
      podLabels: {}
  egress:
    databasePort: 5432
    otelPort: 4317
    # Named destinations only. An empty list means no external egress at all, which is the correct
    # state until an owner supplies the real endpoints.
    external: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1
