# W-0041 / P6-2 — promtool rule unit test backing IT-SLO-ALERT-01.
#
# These drive the real Prometheus rule evaluator with synthetic series, so an alert that would
# never fire fails here rather than during the incident it was meant to catch. Each case asserts
# severity and the threshold, and every threshold has a matching case just below it that must
# stay silent -- a rule that fires on everything is noise, which section 11 forbids as loudly as
# a rule that never fires.
rule_files:
  - ivr-slo.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    name: fail-closed above a fifth of evaluations pages
    input_series:
      - series: 'ivr_intake_decisions_total{ivr_program="GOLDEN_HOUR"}'
        values: '0+10x40'
      - series: 'ivr_fail_closed_total{ivr_program="GOLDEN_HOUR",ivr_reason_code="CAPACITY_SOURCE_UNAVAILABLE"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: IvrDownstreamFailClosedSpike
        exp_alerts:
          - exp_labels:
              severity: page
              slo: downstream_availability
              decision: DO-06
              slo_status: proposed
            exp_annotations:
              summary: More than a fifth of evaluations are failing closed
              description: Holding when a dependency cannot be proven healthy is designed behaviour, so this fires on the proportion, not on any single hold.
              runbook_url: docs/slo.md#downstream-fail-closed

  - interval: 1m
    name: a normal trickle of fail-closed stays silent
    input_series:
      - series: 'ivr_intake_decisions_total{ivr_program="GOLDEN_HOUR"}'
        values: '0+100x40'
      - series: 'ivr_fail_closed_total{ivr_program="GOLDEN_HOUR",ivr_reason_code="CAPACITY_SOURCE_UNAVAILABLE"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: IvrDownstreamFailClosedSpike
        exp_alerts: []
