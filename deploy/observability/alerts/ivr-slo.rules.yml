# W-0041 / P6-2 — Prometheus alert rules for IVR Order Confirmation.
#
# Every rule here names a metric that some production call site actually records. That is not a
# style preference: an instrument that is declared but never called scrapes as a flat line, and a
# flat line reads as health rather than as the silence it is. `UT-DASH-PII-04` walks from these
# expressions back to the call sites and fails if a rule outruns the instrumentation.
#
# Thresholds are PROPOSALS (P6-2 section 4), not owner-approved operating limits. They are derived
# from locked decisions where one exists -- D-04 for callback latency, DT-04 for channel
# auto-disable -- and marked `slo_status: proposed` where no decision fixes them.
groups:
  - name: ivr-slo
    interval: 30s
    rules:
      # D-04: Core revalidate must answer within 3-5s. The objective takes the upper bound.
      - alert: IvrCallbackRevalidateLatencyBreach
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, ivr_program) (rate(ivr_result_callback_duration_seconds_bucket[10m]))
          ) > 5
        for: 10m
        labels:
          severity: page
          slo: callback_revalidate_latency
          decision: D-04
          slo_status: locked
        annotations:
          summary: Callback revalidate p95 is above the 5s objective
          description: p95 delivery time for {{ $labels.ivr_program }} has been above the D-04 objective of 5s for 10 minutes.
          runbook_url: docs/slo.md#callback-revalidate-latency

      # DO-06: fail-closed is correct behaviour, so the alert is on the RATIO, not on any hold.
      # A ratio also survives a change in traffic volume, which an absolute count does not.
      - alert: IvrDownstreamFailClosedSpike
        expr: |
          (
            sum(rate(ivr_fail_closed_total[10m]))
            /
            clamp_min(sum(rate(ivr_intake_decisions_total[10m])), 0.001)
          ) > 0.2
        for: 10m
        labels:
          severity: page
          slo: downstream_availability
          decision: DO-06
          slo_status: proposed
        annotations:
          summary: More than a fifth of evaluations are failing closed
          description: Holding when a dependency cannot be proven healthy is designed behaviour, so this fires on the proportion, not on any single hold.
          runbook_url: docs/slo.md#downstream-fail-closed

      # DT-04 is locked: fail_count >= 3 within 10 minutes auto-disables a channel.
      - alert: IvrChannelAutoDisableBurst
        expr: sum(increase(ivr_channel_quarantines_total[10m])) >= 3
        for: 0m
        labels:
          severity: page
          slo: channel_availability
          decision: DT-04
          slo_status: locked
        annotations:
          summary: Three or more channels auto-disabled within ten minutes
          description: DT-04 fixes the threshold at three failures in ten minutes; the expression carries its own window, so for is 0m.
          runbook_url: docs/slo.md#channel-auto-disable

      # ARCH-06 section 4: callback retry exhausted goes to admin review, not to a pager.
      - alert: IvrCallbackRetryExhausted
        expr: sum(increase(ivr_result_callbacks_total{ivr_outcome="RETRY_EXHAUSTED"}[15m])) > 0
        for: 5m
        labels:
          severity: ticket
          slo: callback_delivery
          decision: ARCH-06
          slo_status: proposed
        annotations:
          summary: A callback exhausted its retries and needs admin review
          description: Ticket rather than page. The outbox already stopped retrying and the row is durable.
          runbook_url: docs/slo.md#callback-retry-exhausted

      # ARCH-06 section 1. The threshold is zero, and that is derived rather than chosen: the
      # capacity model (W-0054) says the pool prod ships covers the modelled peak, so under the
      # model's own assumptions no confirmation window closes uncalled for want of a channel. Any
      # capacity miss therefore falsifies an assumption -- which is why the runbook sends the
      # on-call to recalibration (W-0008) and not to procurement.
      #
      # A zero-tolerance rule is only honest while that premise holds. If the shipped pool ever
      # drops below the modelled peak, the pool itself guarantees misses and this rule becomes
      # noise by construction; `capacity-selftest.mjs` CAP-ALERT-04 asserts the two together so
      # the rule cannot outlive its own justification.
      #
      # W-0369 / K-61. Only the capacity reason, because the argument above covers nothing else.
      # The sweep closes a job under one of three reasons (ivr_reason_code), and only
      # NO_DISPATCH_BEFORE_DEADLINE says a channel was missing: queued and none came, or held by
      # eligibility because none would (K-52). WINDOW_EXPIRED_BEFORE_FINAL_RESULT is a job that was
      # dialled, a dry run, one held for review or one eligibility never answered (K-54);
      # CALLING_HOURS_CLOSED_BEFORE_DISPATCH is the calling hours running out (Q-22.2). The model
      # says nothing about any of them, so summing them here sent the on-call to recalibrate it
      # over orders no channel could have saved. An exact match, not an exclusion: a reason added
      # later stays out of this rule until someone decides it belongs, and CAP-ALERT-04 reads the
      # reasons back out of PostgresSchedulerStore so that it cannot go undecided.
      #
      # Ticket, not page: the job is already closed, the capacity incident is durable and the
      # result carries REVALIDATE_AND_HOLD_ADMIN_REVIEW, so a human already owns the order. What
      # is missing is someone noticing the pattern, and that is a queue, not a pager.
      - alert: IvrConfirmationDeadlineMissed
        expr: sum by (ivr_program) (increase(ivr_missed_deadline_total{ivr_reason_code="NO_DISPATCH_BEFORE_DEADLINE"}[15m])) > 0
        for: 5m
        labels:
          severity: ticket
          slo: capacity_deadline
          decision: ARCH-06
          slo_status: proposed
        annotations:
          summary: A confirmation window closed with no call placed
          description: The capacity model says the shipped pool covers the modelled peak, so a miss on {{ $labels.ivr_program }} falsifies a model assumption. The fix is recalibration against a measured call duration (W-0008), not a bigger pool.
          runbook_url: docs/slo.md#capacity-deadline-missed

      # W-0369 / K-61. The rest of the same counter. Most windows that run out without a final
      # result need nobody: a customer dialled and not reached in time is a result Module 3
      # receives, a dry run never wanted a channel, and an order held for review was counted in
      # ivr_fail_closed_total when it was held -- IvrDownstreamFailClosedSpike pages on those while
      # their windows are still open. There is no baseline for a threshold on the count, so this
      # rule does not put one on it.
      #
      # What needs a person is an order eligibility never answered (K-54): the worker's
      # eligibility loop failing every pass, or switched off. Nothing else sees that. Nothing is
      # evaluated, so nothing fails closed; a loop that throws is still live to the probe, by
      # design; and an order nobody cleared has no attempt for the backlog gauge to age. Before
      # K-61 only the capacity rule fired for it, pointing at the model. The reason cannot tell
      # those orders from the rest, but their shape can: windows keep closing while nothing at
      # all is dialled.
      #
      # 30m of attempts against 15m of expiries. A dialled job's attempt falls inside its window,
      # so at most 15 minutes (24/7, the longest) before it expires, and 15 + 15 keeps that attempt
      # in view for as long as the expiry is counted: a job that was dialled can never raise this
      # rule, only one that was not. for: 20m, the lookback plus the five minutes the rule above
      # holds, so one order held in a quiet half hour cannot open a ticket -- windows have to keep
      # closing. CAP-ALERT-04 holds both inequalities against the model's longest window.
      #
      # Not the hours reason: it closes jobs when calling stops for the night, when nothing is
      # dialled by design, and would open a ticket every evening. Ticket, as above: every job here
      # is already closed and its result is already queued for Module 3.
      - alert: IvrConfirmationWindowsExpiringUndialled
        expr: |
          sum(increase(ivr_missed_deadline_total{ivr_reason_code="WINDOW_EXPIRED_BEFORE_FINAL_RESULT"}[15m])) > 0
          unless
          sum(increase(ivr_call_attempts_total[30m])) > 0
        for: 20m
        labels:
          severity: ticket
          slo: dispatch_flow
          slo_status: proposed
        annotations:
          summary: Confirmation windows keep closing while nothing is dialled
          description: For twenty minutes confirmation windows have kept closing without a final result, and no call has been dialled for half an hour. This is not a channel shortage, which closes under its own reason and opens IvrConfirmationDeadlineMissed. Orders are not reaching the dialler; start with the eligibility loop in the worker health body.
          runbook_url: docs/slo.md#confirmation-windows-expiring-undialled

      - alert: IvrIntakeRejectionRatioHigh
        expr: |
          (
            sum(rate(ivr_intake_decisions_total{ivr_decision=~"TASK_REJECTED.*"}[15m]))
            /
            clamp_min(sum(rate(ivr_intake_decisions_total[15m])), 0.001)
          ) > 0.3
        for: 15m
        labels:
          severity: ticket
          slo: intake_success
          slo_status: proposed
        annotations:
          summary: Intake is rejecting more than three in ten tasks
          description: A sustained rejection ratio points upstream at Sales payloads rather than at IVR.
          runbook_url: docs/slo.md#intake-success

      # W-0041 / P6-2 section 11. The one rule here that reads a gauge. Every other scheduler
      # signal counts events, and a dialler that has stopped produces none: no attempts, no
      # results, and no misses until the first confirmation window closes. How long the oldest
      # dialable call has been waiting is the number that moves while nothing else does.
      #
      # max, never sum: every worker samples the same database and reports the same wait, so a sum
      # would multiply it by the replica count. The third case in ivr-slo.backlog.test.yml pins it.
      #
      # 60s because the windows are short. Golden Hour gives five minutes and 24/7 fifteen, and an
      # attempt leaves the claim once its window closes, so this gauge can never reach a threshold
      # measured in tens of minutes. A minute is a fifth of the Golden Hour window; held for ten, it
      # means customers are being called late, continuously -- which the deadline rule only sees
      # once the orders are already lost. Page for the same reason: this fires while the queue can
      # still be saved, not after the jobs have closed.
      - alert: IvrCallQueueBacklogAging
        expr: max(ivr_call_queue_oldest_due_age_seconds) > 60
        for: 10m
        labels:
          severity: page
          slo: dispatch_backlog
          slo_status: proposed
        annotations:
          summary: Due calls have waited more than a minute to be dialled for ten minutes
          description: The oldest dialable call attempt has been waiting over 60s for ten minutes while the calling window is open. Customers are being called late or not at all, and their confirmation windows keep running.
          runbook_url: docs/slo.md#call-queue-backlog-aging

      # W-0055 / P10-4. The ETL writes a reconcile verdict on every run and, until this rule,
      # nothing read it but a person opening the console. MISMATCH means the warehouse and its
      # source disagree with no backlog or privacy rejection to explain it, or a job-grain fact
      # still disagrees with its job after the refresh; the KPIs built on it look exactly like
      # correct ones. Ticket: no customer is affected, a report is.
      #
      # increase over a window, never the raw counter: compared with zero, a counter fires once and
      # then forever. The last case in ivr-slo.analytics.test.yml proves this one stops.
      - alert: IvrAnalyticsReconcileMismatch
        expr: sum(increase(ivr_analytics_etl_runs_total{ivr_outcome="MISMATCH"}[30m])) > 0
        for: 5m
        labels:
          severity: ticket
          slo: analytics_reconcile
          slo_status: proposed
        annotations:
          summary: The analytics warehouse disagrees with its source
          description: An analytics ETL run ended in MISMATCH within the last 30 minutes. Reporting KPIs may be wrong while looking normal; worker log event 1204 names the grain that disagreed.
          runbook_url: docs/slo.md#analytics-reconcile-mismatch

      # W-0055. Runs are happening and none of them completed: an hour of BACKLOG, a MISMATCH on
      # every run, or a pipeline that throws before it can write a verdict all end here. One that is
      # not running at all does not -- it records nothing, and the worker liveness check owns that.
      #
      # for: 15m because a restarted worker's first COMPLETE lands on a series that did not exist a
      # moment earlier, and increase() cannot see a series' first sample until the next run adds to
      # it. Without the hold, FAILED then COMPLETE then FAILED straight after a restart would open a
      # ticket against a pipeline that had just completed.
      - alert: IvrAnalyticsEtlNotCompleting
        expr: |
          sum(increase(ivr_analytics_etl_runs_total[1h])) > 0
          unless
          sum(increase(ivr_analytics_etl_runs_total{ivr_outcome="COMPLETE"}[1h])) > 0
        for: 15m
        labels:
          severity: ticket
          slo: analytics_freshness
          slo_status: proposed
        annotations:
          summary: The analytics ETL is running but has not completed in an hour
          description: Every analytics ETL run in the last hour ended in BACKLOG, MISMATCH or FAILED. The warehouse is behind the fifteen-minute freshness the reporting console advertises.
          runbook_url: docs/slo.md#analytics-etl-not-completing
