# W-0047 / P7-5 §6.3 — how the cluster gets its secrets once a secret store exists.
#
# NEVER APPLIED. There is no Vault/KMS and no External Secrets Operator (W-0063,
# NEED_CONFIRMATION). This is configuration for infrastructure that does not exist yet; it has
# never synced anything.
#
# The chart REFERENCES Secrets and never carries one (P7-2 §11). These objects are what would
# create those referenced Secrets from an external store, so the chart itself stays unchanged when
# the store arrives — the only thing that changes is who writes the Secret.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ivr-secret-store
spec:
  provider:
    vault:
      server: https://vault.internal.invalid
      path: ivr
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ivr
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ivr-app-secrets
  annotations:
    ivr.ginsengfood/rotation-ttl: "90d"
spec:
  # Short refresh so a rotation in the store reaches the cluster inside the overlap window rather
  # than after it. A refresh slower than the overlap turns a zero-downtime rotation into an outage:
  # the old value is retired before the new one has arrived.
  refreshInterval: 1m
  secretStoreRef:
    name: ivr-secret-store
    kind: SecretStore
  target:
    name: ivr-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: internal-service-token
      remoteRef:
        key: ivr/service
        property: internal-service-token
    - secretKey: order-core-service-token
      remoteRef:
        key: ivr/service
        property: order-core-service-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ivr-database
  annotations:
    ivr.ginsengfood/rotation-ttl: "90d"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: ivr-secret-store
    kind: SecretStore
  target:
    name: ivr-database
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ivr/database
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ivr-dial-token-resolver
  annotations:
    # The most sensitive credential in the inventory (D-05), so the shortest TTL.
    ivr.ginsengfood/rotation-ttl: "30d"
    ivr.ginsengfood/scope-note: >-
      This is the credential used to ASK the token vault, not a key that decrypts anything. IVR
      holds no dial_token-to-number mapping and no key for one (OD-V1-18); rotating this cannot
      expose a destination even if it is done wrong.
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: ivr-secret-store
    kind: SecretStore
  target:
    name: ivr-dial-token-resolver
    creationPolicy: Owner
  data:
    - secretKey: resolver-credential
      remoteRef:
        key: ivr/dial-token-resolver
        property: credential
