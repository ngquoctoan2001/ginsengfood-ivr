# W-0104 — explicit, disposable Asterisk + MicroSIP lab overlay.
#
# This file is never loaded by `docker compose up` on its own. It must be named
# explicitly alongside docker-compose.dev.yml, and it remains pinned to one opaque
# destination alias (LAB-A). It cannot dial a PSTN number or a real customer.

x-asterisk-lab-env: &asterisk-lab-env
  IVR_EXECUTION_MODE: LAB_REAL_SIM
  IVR_ADAPTER_MODE: ASTERISK_ARI
  REAL_CUSTOMER_CALL_ALLOWED: "NO"
  SALES_PROVIDER: FAKE_TARGET_V1
  SIM_PROVIDER: VENDOR
  Ivr__Telephony__Asterisk__Enabled: "true"
  Ivr__Telephony__Asterisk__BaseUrl: "http://asterisk:8088"
  Ivr__Telephony__Asterisk__Username: "ivr-lab"
  Ivr__Telephony__Asterisk__Password: "${IVR_LAB_ARI_PASSWORD:?Set IVR_LAB_ARI_PASSWORD in .env}"
  Ivr__Telephony__Asterisk__Application: "ivr-lab"
  Ivr__Telephony__Asterisk__Environment: "lab"
  Ivr__Telephony__Asterisk__DestinationAlias: "LAB-A"
  Ivr__Telephony__Asterisk__SimChannelId: "SIM-ASTERISK-001"
  Ivr__Telephony__Asterisk__AdapterMode: "ASTERISK_ARI"
  Ivr__Telephony__Asterisk__ProviderName: "ASTERISK_ARI"
  Ivr__Telephony__Asterisk__RecordingEnabled: "false"
  Ivr__Telephony__Asterisk__DtmfTimeoutSeconds: "60"
  Ivr__Speech__Tts__Provider: "STATIC_FILE"
  Ivr__Speech__Tts__OutputFormat: "audio/wav"
  Ivr__Speech__Tts__SampleRate: "8000"
  Ivr__Speech__Tts__VoiceId: "w0104-static-file"
  Ivr__Speech__Tts__FileMediaReference: "sound:ivr-lab-order-confirmation"
  Ivr__Speech__Tts__FileDurationSeconds: "18"
  # W-0106 regional voice routing. Enabled is "false" until Convert-LabVoiceAudio.ps1 has
  # produced the three PCM files and written their real durations here; the validator refuses
  # to start with blank voice IDs, so flipping this early fails the lab loudly rather than
  # quietly playing one region's audio to every caller.
  Ivr__Speech__Tts__RegionalVoices__Enabled: "false"
  Ivr__Speech__Tts__RegionalVoices__FallbackRegion: "North"
  Ivr__Speech__Tts__RegionalVoices__North__VoiceId: "w0106-lab-north-tham"
  Ivr__Speech__Tts__RegionalVoices__North__FileMediaReference: "sound:ivr-lab-order-confirmation-region-north"
  Ivr__Speech__Tts__RegionalVoices__North__FileDurationSeconds: "18"
  Ivr__Speech__Tts__RegionalVoices__Central__VoiceId: "w0106-lab-central-zara"
  Ivr__Speech__Tts__RegionalVoices__Central__FileMediaReference: "sound:ivr-lab-order-confirmation-region-central"
  Ivr__Speech__Tts__RegionalVoices__Central__FileDurationSeconds: "18"
  Ivr__Speech__Tts__RegionalVoices__South__VoiceId: "w0106-lab-south-giang"
  Ivr__Speech__Tts__RegionalVoices__South__FileMediaReference: "sound:ivr-lab-order-confirmation-region-south"
  Ivr__Speech__Tts__RegionalVoices__South__FileDurationSeconds: "18"
  # W-0106 A1 hybrid playback: recorded prose plus synthesized order values, assembled per call.
  #
  # Off until BOTH halves exist. The recorded half comes from Convert-LabSegmentAudio.ps1, which
  # writes a ready-to-paste block into deploy/lab/asterisk/audio/segments-appsettings.json — do
  # not hand-copy the 64-character hashes, one wrong character is a sentence that cannot be
  # found, and it only shows up mid-call.
  #
  # The synthesized half needs a vendor (OD-VOICE-01) reachable at Ivr__Speech__Tts__External__*.
  # With Enabled=true and an incomplete recording catalog the service refuses to start, which is
  # the intended failure: a missing sentence must stop a deployment, not shorten a call.
  Ivr__Speech__Tts__Segmentation__Enabled: "false"
  Ivr__Speech__Tts__Segmentation__FixedSegments: "Catalog"

services:
  asterisk:
    build:
      context: ./deploy/lab/asterisk
      dockerfile: Dockerfile
    image: ivr-asterisk-lab:w0104
    environment:
      IVR_LAB_ARI_PASSWORD: "${IVR_LAB_ARI_PASSWORD:?Set IVR_LAB_ARI_PASSWORD in .env}"
      IVR_LAB_SIP_PASSWORD: "${IVR_LAB_SIP_PASSWORD:?Set IVR_LAB_SIP_PASSWORD in .env}"
      IVR_LAB_VOICE_VARIANT: "${IVR_LAB_VOICE_VARIANT:-A}"
    ports:
      - "127.0.0.1:${IVR_LAB_ARI_PORT:-18088}:8088/tcp"
      - "127.0.0.1:${IVR_LAB_SIP_PORT:-5060}:5060/udp"
      - "127.0.0.1:10000-10020:10000-10020/udp"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ivr-lab-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - ivr-database-local

  lab-seed:
    image: postgres:16
    command:
      - psql
      - --set
      - ON_ERROR_STOP=1
      - --host
      - postgres
      - --username
      - ivr
      - --dbname
      - ivr
      - --file
      - /lab/seed.sql
    volumes:
      - ./deploy/lab/seed.sql:/lab/seed.sql:ro
    depends_on:
      ivr-migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - ivr-database-local

  ivr-api:
    environment:
      <<: *asterisk-lab-env
    depends_on:
      lab-seed:
        condition: service_completed_successfully

  ivr-worker:
    environment:
      <<: *asterisk-lab-env
      Ivr__Scheduler__Enabled: "true"
      Ivr__Scheduler__PollIntervalMilliseconds: "500"
      Ivr__Normalization__Enabled: "true"
      Ivr__Normalization__PollIntervalMilliseconds: "500"
      Ivr__CallbackDelivery__Enabled: "true"
      Ivr__CallbackDelivery__PollIntervalMilliseconds: "500"
      Ivr__CallbackDelivery__TargetBaseUrl: "http://fake-sales:8080"
    depends_on:
      asterisk:
        condition: service_healthy
      lab-seed:
        condition: service_completed_successfully
