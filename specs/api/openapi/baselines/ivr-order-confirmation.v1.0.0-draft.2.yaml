openapi: 3.1.0
info:
  title: IVR Order Confirmation — Internal/Admin API (Target V1 Draft)
  version: 1.0.0-draft.2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Target V1 draft for the standalone .NET IVR service. Not a public API. The
    Sales Platform owns eligibility, revalidation, and order-state transitions.
    Supports GOLDEN_HOUR+ONLINE and TWENTY_FOUR_SEVEN+COD. External Sales callback
    is specified separately in order-core-ivr-callback.target-v1.yaml.
servers:
  - url: /v1/ivr/order-confirmation
    description: Internal base path
security:
  - bearerAuth: []
tags:
  - name: internal
    description: Service-to-service operations owned by the standalone IVR service.
  - name: admin
    description: Masked, permission-gated operator controls and projections.
paths:
  /tasks:
    post:
      tags: [internal]
      summary: Task intake (Order Core -> IVR, push sync)
      operationId: intakeTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IvrConfirmationTaskV1' }
      responses:
        '200': { description: Intake decision, content: { application/json: { schema: { $ref: '#/components/schemas/IvrTaskIntakeResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /eligibility-checks:
    post:
      tags: [internal]
      summary: Persist eligibility decision
      operationId: recordEligibility
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrEligibilityDecision' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs:
    post:
      tags: [internal]
      summary: Create/record CallJob
      operationId: createCallJob
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallJobLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}:
    get:
      tags: [internal]
      summary: Read CallJob (masked)
      operationId: getCallJob
      parameters:
        - name: ivrCallJobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-attempts:
    post:
      tags: [internal]
      summary: Record call attempt
      operationId: recordAttempt
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallAttemptLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallAttempt' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-results:
    post:
      tags: [internal]
      summary: Record normalized result
      operationId: recordResult
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallResultLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /result-callbacks:
    post:
      tags: [internal]
      summary: Record callback lifecycle (delivery to Order Core is outbound)
      operationId: recordResultCallback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResultCallbackLifecycleRequest' } } }
      responses:
        '200': { description: Recorded internal delivery lifecycle, content: { application/json: { schema: { $ref: '#/components/schemas/IvrResultCallbackLifecycle' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:
    get:
      tags: [admin]
      summary: Queue/capacity projection (masked)
      operationId: getQueue
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrQueueProjection' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:pause:
    post:
      tags: [admin]
      summary: Pause queue (perm IVR_QUEUE_PAUSE)
      operationId: pauseQueue
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:resume:
    post:
      tags: [admin]
      summary: Resume queue (perm IVR_QUEUE_RESUME)
      operationId: resumeQueue
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /sim-channels/{simChannelId}:disable:
    post:
      tags: [admin]
      summary: Disable SIM channel (perm IVR_SIM_DISABLE)
      operationId: disableSim
      parameters:
        - name: simChannelId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /sim-channels/{simChannelId}:enable:
    post:
      tags: [admin]
      summary: Enable SIM channel after health pass (perm IVR_SIM_ENABLE)
      operationId: enableSim
      parameters:
        - name: simChannelId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /technical-retries:
    post:
      tags: [admin]
      summary: Request technical retry (perm IVR_MANUAL_RETRY; not a customer attempt)
      operationId: technicalRetry
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TechnicalRetryRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrTechnicalRetryResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /admin-reviews:
    post:
      tags: [admin]
      summary: Record review/annotation (perm IVR_RESULT_REVIEW)
      operationId: adminReview
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminReviewRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminReviewResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /feature-flags/{environment}:
    get:
      tags: [admin]
      summary: Read a fresh typed feature-flag snapshot (perm IVR_FLAG_READ)
      operationId: getFeatureFlags
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Fresh snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagReadResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Atomically mutate runtime controls (perm IVR_RUNTIME_GATE_ADMIN; OD-V1-20 pending)
      operationId: mutateFeatureFlags
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagMutationRequest' } } }
      responses:
        '200': { description: Audited mutation and verified revision, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagMutationResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /feature-flags/{environment}/kill-switch:
    get:
      tags: [admin]
      summary: Verify effective kill-switch state (perm IVR_FLAG_READ)
      operationId: verifyFeatureFlagKillSwitch
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Effective fail-closed state, content: { application/json: { schema: { $ref: '#/components/schemas/KillSwitchVerification' } } } }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service token (allowlist Order Core, DF-06) or admin session (DF-01).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: { type: string }
    SourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [sales-platform, order-core] }
    InternalSourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [ivr-worker, ivr-adapter] }
    InternalServiceScope:
      name: X-Service-Scope
      in: header
      required: true
      schema: { type: string, enum: [ivr.internal.write] }
    FeatureFlagEnvironment:
      name: environment
      in: path
      required: true
      schema: { type: string, enum: [dev, staging, lab, pilot, prod] }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorCode:
      type: string
      description: Stable IVR error envelope code catalog (api/06 §1c).
      enum:
        - IVR_UNAUTHENTICATED
        - IVR_FORBIDDEN_CALLER
        - IVR_MALFORMED_REQUEST
        - IVR_MISSING_TRACE
        - IVR_IDEMPOTENCY_CONFLICT
        - IVR_VERSION_CONFLICT
        - IVR_NOT_OFFICIAL_ORDER
        - IVR_STATE_NOT_CALLABLE
        - IVR_POLICY_MISMATCH
        - IVR_CONTACT_INVALID
        - IVR_SCRIPT_NOT_APPROVED
        - IVR_PII_POLICY_VIOLATION
        - IVR_OPERATIONAL_BLOCKED
        - IVR_NOT_FOUND
        - IVR_RATE_LIMITED
        - IVR_INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    ProgramCode:
      type: string
      enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN]
    OrderSpeechItem:
      type: object
      additionalProperties: false
      required: [public_name, quantity]
      properties:
        public_name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_label: { type: string, maxLength: 40 }
    PrivacySafeOrderSummary:
      type: object
      additionalProperties: false
      required:
        - customer_display_name
        - order_code_short
        - items
        - total_amount
        - currency
        - delivery_area_short
        - program_display_name
        - locale
      properties:
        customer_display_name: { type: string, minLength: 1, maxLength: 80 }
        order_code_short: { type: string, minLength: 1, maxLength: 40 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSpeechItem' }
        total_amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [VND] }
        delivery_area_short:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^(?!\s*\d)(?!.*\d+\s*/\s*\d+).*$'
          description: >
            Privacy-reviewed short area only (phường/xã, quận/huyện, tỉnh/thành).
            The pattern rejects a house-number prefix (a leading digit, e.g. "123 Nguyen Hue")
            and slash-form house numbers ("12/3 Le Loi"), while still ACCEPTING legitimate
            numbered administrative units such as "Quan 7" or "Phuong 12".
            It is only the machine-enforceable half of the rule: a digit-free street address
            ("Duong Nguyen Hue, Phuong Ben Nghe") still passes the schema and MUST be rejected
            by the IVR-side semantic full-address detector at intake (FR-IVR-INTAKE-005) with
            IVR_PII_POLICY_VIOLATION. Sales remains responsible for normalising the value.
        program_display_name: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [vi-VN] }
        pronunciation_hints:
          type: object
          additionalProperties: { type: string }
    SellableStatusLine:
      type: object
      required: [sku_id, decision, captured_at]
      properties:
        sku_id: { type: string }
        batch_id: { type: string }
        decision: { type: string, enum: [SELLABLE, NOT_SELLABLE, BLOCKED, UNKNOWN] }
        recall_hold: { type: boolean }
        sale_lock: { type: boolean }
        quality_hold: { type: boolean }
        stock_available: { type: boolean }
        batch_released: { type: boolean }
        trace_ready: { type: boolean }
        captured_at: { type: string, format: date-time }
    IvrConfirmationTaskV1:
      type: object
      additionalProperties: false
      allOf:
        - oneOf:
            - properties:
                program_code: { const: GOLDEN_HOUR }
                payment_method_snapshot: { const: ONLINE }
            - properties:
                program_code: { const: TWENTY_FOUR_SEVEN }
                payment_method_snapshot: { const: COD }
      required:
        - contract_version
        - task_id
        - order_id
        - order_code
        - order_version
        - order_state
        - payment_method_snapshot
        - program_code
        - ivr_confirmation_required
        - confirmation_window_started_at
        - confirmation_window_expires_at
        - attempt_policy_version
        - max_customer_attempts
        - attempt_offsets_seconds
        - phone_ref
        - phone_masked
        - dial_token
        - dial_token_expires_at
        - privacy_safe_order_summary
        - call_restriction
        - eligibility_snapshot
        - evidence_ref
      properties:
        contract_version: { type: string, enum: [ivr-order-confirmation.v1] }
        task_id: { type: string }
        # Optional in body; the X-Correlation-Id header is the source of truth.
        # If both are present they MUST match, otherwise 422.
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        order_id: { type: string }
        order_code: { type: string }
        order_code_short: { type: string }
        order_version: { type: string, description: Required Target V1 stale-result guard snapshot. }
        order_state: { type: string, description: Opaque enum owned by Order Core (D-02) }
        payment_method_snapshot: { type: string, enum: [ONLINE, COD] }
        ivr_confirmation_required: { type: boolean, enum: [true] }
        is_ivr_callable: { type: boolean, description: Optional convenience flag; Sales remains source of truth. }
        program_code: { $ref: '#/components/schemas/ProgramCode' }
        confirmation_window_started_at: { type: string, format: date-time }
        confirmation_window_expires_at: { type: string, format: date-time }
        attempt_policy_version: { type: string }
        max_customer_attempts: { type: integer, minimum: 1, maximum: 10 }
        attempt_offsets_seconds:
