    IvrCallAttemptDetail:
      type: object
      additionalProperties: false
      required:
        - ivr_call_attempt_id
        - attempt_number
        - scheduled_at
        - status
        - is_counted_customer_attempt
        - technical_retry_count
        - policy_version
        - script_version
      properties:
        ivr_call_attempt_id: { type: string }
        attempt_number: { type: integer, minimum: 1 }
        scheduled_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        status: { type: string }
        result_status: { type: string }
        disposition: { type: string }
        dtmf_key: { type: string, description: Business semantic only (1 confirm / 0 cancel); never a raw payload. }
        is_counted_customer_attempt: { type: boolean }
        technical_retry_count: { type: integer, minimum: 0 }
        technical_exception_type: { type: string }
        sim_channel_id: { type: string }
        blocked_reason: { type: string }
        policy_version: { type: string }
        script_version: { type: string }
        voice_id:
          type: [string, "null"]
          description: >
            W-0113. The provider voice this attempt dialled with, recorded at dispatch rather
            than re-derived at read time. Explicitly null - not omitted - when nothing was
            recorded, because an absent field and a null one are indistinguishable to a reader
            and "was this recorded" is the exact question this field exists to answer.
        voice_region:
          type: [string, "null"]
          enum: [North, Central, South]
          description: >
            W-0113. The region recorded for this attempt at dispatch. Null on attempts made
            before the columns existed and on any path that dials without choosing a voice; null
            means "not recorded", never "no voice".
        voice_region_resolved:
          type: [boolean, "null"]
          description: >
            W-0113. True when the region came from a recognised province in the delivery area,
            false when it came from the configured fallback. "South because we recognised the
            address" and "South because South is the default" are different claims, and only the
            first is evidence about this customer.
