        simProvider: { type: string, enum: [MOCK, VENDOR] }
        attemptPolicyVersion: { type: string }
        realCustomerCallAllowed: { type: boolean }
        labDestinationAllowlist:
          type: array
          uniqueItems: true
          items: { type: string }
        globalDialKillSwitch: { type: boolean }
        v1NotificationEnabled: { type: boolean }
        recordingEnabled: { type: boolean }
    FeatureFlagMutationRequest:
      type: object
