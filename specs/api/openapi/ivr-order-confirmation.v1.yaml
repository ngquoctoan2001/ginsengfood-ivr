    FeatureFlagMutationResult:
      type: object
      additionalProperties: false
      required: [snapshot, increasedRiskKeys]
      properties:
        snapshot: { $ref: '#/components/schemas/FeatureFlagSnapshot' }
        approvedBy: { type: [string, 'null'] }
        increasedRiskKeys:
          type: array
