        - technical_exception_id
        - target_attempt_id
        - technical_retry_count
        - customer_attempt_counted
        - queue_status
        - no_policy_bypass
      properties:
        admin_action_id: { type: string }
        technical_exception_id: { type: string }
        target_attempt_id: { type: string }
        technical_retry_count: { type: integer, minimum: 1 }
        customer_attempt_counted: { type: boolean, enum: [false] }
        queue_status: { type: string }
        no_policy_bypass: { type: boolean, enum: [true] }
    IvrAdminReviewResult:
      type: object
      additionalProperties: false
      required:
        - admin_action_id
        - review_item_id
        - status
        - resolution
        - result_unchanged
        - no_policy_bypass
      properties:
        admin_action_id: { type: string }
        review_item_id: { type: string }
        status: { type: string, enum: [RESOLVED] }
        resolution: { type: string }
        result_unchanged: { type: boolean, enum: [true] }
        no_policy_bypass: { type: boolean, enum: [true] }
    FeatureFlagSnapshot:
      type: object
      additionalProperties: false
      required:
        - environment
        - revision
