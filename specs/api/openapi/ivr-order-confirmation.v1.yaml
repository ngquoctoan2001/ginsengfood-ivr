openapi: 3.1.0
info:
  title: IVR Order Confirmation — Internal/Admin API (Target V1 Draft)
  version: 1.0.0-draft.19
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Target V1 draft for the standalone .NET IVR service. Not a public API. The
    Sales Platform owns eligibility, revalidation, and order-state transitions.
    Supports GOLDEN_HOUR+ONLINE and TWENTY_FOUR_SEVEN+COD. External Sales callback
    is specified separately in order-core-ivr-callback.target-v1.yaml.
servers:
  - url: /v1/ivr/order-confirmation
    description: Internal base path
security:
  - bearerAuth: []
tags:
  - name: internal
    description: Service-to-service operations owned by the standalone IVR service.
  - name: admin
    description: Masked, permission-gated operator controls and projections.
paths:
  /tasks:
    post:
      tags: [internal]
      summary: Task intake (Order Core -> IVR, push sync)
      operationId: intakeTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IvrConfirmationTaskV1' }
      responses:
        '200': { description: Intake decision, content: { application/json: { schema: { $ref: '#/components/schemas/IvrTaskIntakeResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /eligibility-checks:
    post:
      tags: [internal]
      summary: Persist eligibility decision
      operationId: recordEligibility
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrEligibilityDecision' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs:
    post:
      tags: [internal]
      summary: Create/record CallJob
      operationId: createCallJob
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallJobLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    get:
      tags: [admin]
      summary: Call-job list, masked and paginated (perm IVR_QUEUE_VIEW)
      description: >-
        `order_code` is a filter input only and is never echoed; the response
        carries the script-approved `order_code_short` (D-05, specs/ui/02).
      operationId: listCallJobs
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: program, in: query, required: false, schema: { $ref: '#/components/schemas/ProgramCode' } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: queue_status, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: result_type, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: order_code, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: correlation_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: near_expiry, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJobPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}:
    get:
      tags: [internal]
      summary: Read CallJob (masked)
      operationId: getCallJob
      parameters:
        - name: ivrCallJobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-attempts:
    post:
      tags: [internal]
      summary: Record call attempt
      operationId: recordAttempt
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallAttemptLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallAttempt' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-results:
    post:
      tags: [internal]
      summary: Record normalized result
      operationId: recordResult
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallResultLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /result-callbacks:
    post:
      tags: [internal]
      summary: Record callback lifecycle (delivery to Order Core is outbound)
      operationId: recordResultCallback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResultCallbackLifecycleRequest' } } }
      responses:
        '200': { description: Recorded internal delivery lifecycle, content: { application/json: { schema: { $ref: '#/components/schemas/IvrResultCallbackLifecycle' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:
    get:
      tags: [admin]
      summary: Queue/capacity projection (masked)
      operationId: getQueue
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrQueueProjection' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [admin]
      summary: Operational dashboard projection, masked (perm IVR_QUEUE_VIEW)
      description: >-
        Aggregates are computed server-side so the console never derives a KPI
        from raw rows. SIM pool and open incidents are pool-wide and ignore the
        program/time filter.
      operationId: getDashboard
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: program, in: query, required: false, schema: { $ref: '#/components/schemas/ProgramCode' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrDashboardProjection' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}/detail:
    get:
      tags: [admin]
      summary: Full masked lifecycle trace for one call job (perm IVR_QUEUE_VIEW)
      description: >-
        task intake to eligibility to attempts to result to callback, plus the
        technical-exception and review-item ids the admin mutations require.
        `order_state` is the opaque Core enum; IVR displays it and never changes
        it (D-02).
      operationId: getCallJobDetail
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: ivrCallJobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJobDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /sim-channels:
    get:
      tags: [admin]
      summary: SIM channel roster, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        The roster behind the dashboard SIM panel, so the enable/disable
        operations in specs/ui/08 §3 have a console surface. `sim_number_ref` is
        deliberately not projected: it points at a phone identity the console has
        no use for (D-05). Lease internals are omitted as scheduler mechanics.
      operationId: listSimChannels
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrSimChannelList' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts:
    get:
      tags: [admin]
      summary: Call-script catalogue, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        Versions with their approval matrix, the allowed and prohibited variable
        lists, and the DTMF map. KEY_9 is reported NOT_ENABLED (AS-07). Lifecycle
        transitions live on the sibling routes below (W-0109); leaving them unexposed
        left hand-edited rows as the only path for a Privacy/Legal signature, and
        therefore no audit, no reason and no four-eyes.
      operationId: getScriptCatalog
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptCatalog' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Create a script version draft (perm IVR_SCRIPT_EDIT)
      description: >-
        A version is immutable once created, so a wording change is a new version
        and the previous one keeps its own approvals and audit trail.
      operationId: createScriptDraft
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptDraftRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts/{templateId}/{version}:
    get:
      tags: [admin]
      summary: One script version in any state, including drafts (perm IVR_QUEUE_VIEW)
      description: >-
        approved_for_modes is derived from the approvals at read time rather than
        stored, because the same approval set means different things once the
        OD-V1-15 whitelist is signed. production_blocked_reason names the missing
        precondition instead of leaving an empty mode list to be interpreted.
      operationId: getScriptVersion
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ScriptTemplateId'
        - $ref: '#/components/parameters/ScriptVersion'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptVersionDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts/{templateId}/{version}:submit:
    post:
      tags: [admin]
      summary: Move a draft into review (perm IVR_SCRIPT_REVIEW)
      operationId: submitScriptForReview
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ScriptTemplateId'
        - $ref: '#/components/parameters/ScriptVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptTransitionRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts/{templateId}/{version}:approve:
    post:
      tags: [admin]
      summary: Record one approval (perm IVR_SCRIPT_APPROVE_* per approval_type)
      description: >-
        403 when the caller is the wrong person for this version - the creator, or the
        account that already signed the other half of the production pair. That is not a
        state conflict: retrying cannot fix it, a second approver can. 409 when the
        version's own state refuses, such as a duplicate approval type.
      operationId: approveScriptVersion
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ScriptTemplateId'
        - $ref: '#/components/parameters/ScriptVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptApprovalRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts/{templateId}/{version}:retire:
    post:
      tags: [admin]
      summary: Retire a script version (perm IVR_SCRIPT_RETIRE)
      description: >-
        A retired version fails closed in every execution mode and is never deleted.
      operationId: retireScriptVersion
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ScriptTemplateId'
        - $ref: '#/components/parameters/ScriptVersion'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptTransitionRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /dev/seed:load:
    post:
      tags: [admin]
      summary: Load the seed fixtures (NON-PRODUCTION ONLY, perm IVR_DEV_TOOLING)
      description: >-
        Absent in production. The route is not mapped when the deployment is
        production by environment, by execution mode or by
        REAL_CUSTOMER_CALL_ALLOWED, so a production caller gets 404 rather than
        403 - a 403 would confirm that a seed loader exists at this address.
        Fixtures are admitted through the same intake service production uses,
        so a do-not-call customer stays blocked and nothing bypasses policy.
        Confirmation windows are rebased to now by default because the fixtures
        carry absolute August-2026 instants and would otherwise all be refused
        as expired.
      operationId: loadDevSeed
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrSeedLoadRequest' } } }
      responses:
        '200': { description: Fixtures processed, content: { application/json: { schema: { $ref: '#/components/schemas/IvrSeedLoadResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /dev/scenarios/{scenarioId}:dry-run:
    post:
      tags: [admin]
      summary: Replay a call scenario without dialling (NON-PRODUCTION ONLY, perm IVR_DEV_TOOLING)
      description: >-
        Replays the scenario's recorded attempts through disposition
        normalisation and compares the result with what the seed file expects.
        No call is placed, and that is structural rather than suppressed - the
        replay engine holds no telephony port. A scenario whose expected result
        comes from task intake or from the confirmation-window sweep answers
        NOT_REPLAYABLE with no verdict, because calling it a mismatch would point
        at the wrong file.
      operationId: dryRunDevScenario
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - name: scenarioId
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: Replay report, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScenarioDryRunResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
