        '403': { $ref: '#/components/responses/ConsoleAccountError' }
        '409': { $ref: '#/components/responses/ConsoleAccountError' }
        '422': { $ref: '#/components/responses/ConsoleAccountError' }
  /accounts/me:
    get:
      tags: [admin]
      summary: Read the current account profile (perm IVR_ACCOUNT_SELF_VIEW)
      operationId: getMyConsoleAccount
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Current account profile, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleAccount' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [admin]
      summary: Read a console account (perm IVR_ACCOUNT_VIEW)
      operationId: getConsoleAccount
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleAccount' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
        '404': { $ref: '#/components/responses/ConsoleAccountError' }
    patch:
      tags: [admin]
      summary: Update role, status, or display name (perm IVR_ACCOUNT_MANAGE)
      operationId: updateConsoleAccount
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateConsoleAccountRequest' }
      responses:
        '200': { description: Updated account or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleAccount' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
        '404': { $ref: '#/components/responses/ConsoleAccountError' }
        '409': { $ref: '#/components/responses/ConsoleAccountError' }
        '422': { $ref: '#/components/responses/ConsoleAccountError' }
    delete:
      tags: [admin]
      summary: Soft-delete a console account and revoke sessions (perm IVR_ACCOUNT_MANAGE)
      operationId: deleteConsoleAccount
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteConsoleAccountRequest' }
      responses:
        '200': { description: Soft-deleted account or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleAccount' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
        '404': { $ref: '#/components/responses/ConsoleAccountError' }
        '409': { $ref: '#/components/responses/ConsoleAccountError' }
        '422': { $ref: '#/components/responses/ConsoleAccountError' }
  /accounts/{accountId}:reset-password:
    post:
      tags: [admin]
      summary: Replace a password, clear lockout, and revoke sessions (perm IVR_ACCOUNT_PASSWORD_RESET)
      operationId: resetConsoleAccountPassword
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetConsolePasswordRequest' }
      responses:
        '200': { description: Updated account or idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleAccount' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
        '404': { $ref: '#/components/responses/ConsoleAccountError' }
        '409': { $ref: '#/components/responses/ConsoleAccountError' }
        '422': { $ref: '#/components/responses/ConsoleAccountError' }
  /account-roles:
    get:
      tags: [admin]
      summary: Read the immutable two-role permission matrix (perm IVR_ACCOUNT_VIEW)
      operationId: getConsoleAccountRoles
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: Role matrix, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleRoleMatrix' } } } }
        '401': { $ref: '#/components/responses/ConsoleAccountError' }
        '403': { $ref: '#/components/responses/ConsoleAccountError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service token (allowlist Order Core, DF-06) or admin session (DF-01).
  parameters:
    ScriptTemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string, maxLength: 120, pattern: '^[A-Za-z0-9._-]+$' }
    ScriptVersion:
      name: version
      in: path
      required: true
      schema: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9._-]+$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: { type: string }
    SourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [sales-platform, order-core] }
    InternalSourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [ivr-worker, ivr-adapter] }
    AnalyticsProgram:
      name: program
      in: query
      required: false
      schema: { type: string, enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN] }
    AnalyticsResultType:
      name: result_type
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    AnalyticsScriptVariant:
      name: script_variant
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    AnalyticsBucket:
      name: bucket
      in: query
      required: false
      schema: { type: string, enum: [DAY, HOUR], default: DAY }
    AnalyticsDimension:
      name: dimension
      in: query
      required: false
      schema: { type: string, enum: [RESULT_TYPE, SCRIPT_VARIANT, PROGRAM], default: RESULT_TYPE }
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    InternalServiceScope:
      name: X-Service-Scope
      in: header
      required: true
      schema: { type: string, enum: [ivr.internal.write] }
    FeatureFlagEnvironment:
      name: environment
      in: path
      required: true
      schema: { type: string, enum: [dev, staging, lab, pilot, prod] }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConsoleAccountError:
      description: Console authentication/account error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConsoleAccountErrorEnvelope' }
  schemas:
    ErrorCode:
      type: string
      description: Stable IVR error envelope code catalog (api/06 §1c).
      enum:
        - IVR_UNAUTHENTICATED
        - IVR_FORBIDDEN_CALLER
        - IVR_MALFORMED_REQUEST
        - IVR_MISSING_TRACE
        - IVR_IDEMPOTENCY_CONFLICT
        - IVR_VERSION_CONFLICT
        - IVR_NOT_OFFICIAL_ORDER
        - IVR_STATE_NOT_CALLABLE
        - IVR_POLICY_MISMATCH
        - IVR_CONTACT_INVALID
        - IVR_SCRIPT_NOT_APPROVED
        - IVR_PII_POLICY_VIOLATION
        - IVR_OPERATIONAL_BLOCKED
        - IVR_NOT_FOUND
        - IVR_RATE_LIMITED
        - IVR_INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    ConsoleAccountErrorCode:
      type: string
      description: Stable console auth/account error codes; isolated so existing endpoint response enums do not drift.
      enum:
        - IVR_UNAUTHENTICATED
        - IVR_FORBIDDEN_CALLER
        - IVR_MALFORMED_REQUEST
        - IVR_MISSING_TRACE
        - IVR_IDEMPOTENCY_CONFLICT
        - IVR_VERSION_CONFLICT
        - IVR_NOT_OFFICIAL_ORDER
        - IVR_STATE_NOT_CALLABLE
        - IVR_POLICY_MISMATCH
        - IVR_CONTACT_INVALID
        - IVR_SCRIPT_NOT_APPROVED
        - IVR_PII_POLICY_VIOLATION
        - IVR_OPERATIONAL_BLOCKED
        - IVR_NOT_FOUND
        - IVR_RATE_LIMITED
        - IVR_ACCOUNT_CONFLICT
        - IVR_ACCOUNT_POLICY_VIOLATION
        - IVR_INTERNAL_ERROR
    ConsoleAccountErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ConsoleAccountErrorCode' }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    ConsoleRole:
      type: string
      enum: [Admin, Operator]
    ConsoleAccountStatus:
      type: string
      enum: [ACTIVE, DISABLED, DELETED]
    ConsoleSignInRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
        password: { type: string, format: password, minLength: 1, maxLength: 128, writeOnly: true }
    ConsoleAccount:
      type: object
      additionalProperties: false
      required: [account_id, username, display_name, role, status, is_builtin, is_locked, password_changed_at, created_at, updated_at, version]
      properties:
        account_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/ConsoleRole' }
        status: { $ref: '#/components/schemas/ConsoleAccountStatus' }
        is_builtin: { type: boolean }
        is_locked: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        password_changed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    ConsoleSession:
      type: object
      additionalProperties: false
      required: [account, permissions, expires_at]
      properties:
        account: { $ref: '#/components/schemas/ConsoleAccount' }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
        expires_at: { type: string, format: date-time }
    ConsoleSignInResult:
      type: object
      additionalProperties: false
      required: [access_token, token_type, session]
      properties:
        access_token: { type: string, minLength: 32, writeOnly: true }
        token_type: { type: string, enum: [Bearer] }
        session: { $ref: '#/components/schemas/ConsoleSession' }
    ConsoleSignOutResult:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: { type: boolean }
    ConsoleAccountPage:
      type: object
      additionalProperties: false
      required: [page, page_size, total_count, items]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ConsoleAccount' }
    CreateConsoleAccountRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, role, password, reason]
      properties:
        username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,63}$' }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        role: { $ref: '#/components/schemas/ConsoleRole' }
        password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
        reason: { type: string, minLength: 3, maxLength: 500 }
    UpdateConsoleAccountRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      anyOf:
        - required: [display_name]
        - required: [role]
        - required: [status]
      properties:
        display_name: { type: [string, 'null'], minLength: 1, maxLength: 160 }
        role:
          anyOf:
            - $ref: '#/components/schemas/ConsoleRole'
            - type: 'null'
        status:
          anyOf:
            - $ref: '#/components/schemas/ConsoleAccountStatus'
            - type: 'null'
        version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ResetConsolePasswordRequest:
      type: object
      additionalProperties: false
      required: [new_password, version, reason]
      properties:
        new_password: { type: string, format: password, minLength: 12, maxLength: 128, writeOnly: true }
        version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    DeleteConsoleAccountRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ConsoleRoleMatrix:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [role, label, permissions]
            properties:
              role: { $ref: '#/components/schemas/ConsoleRole' }
              label: { type: string }
              permissions:
                type: array
                uniqueItems: true
                items: { type: string }
    ProgramCode:
      type: string
      enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN]
    OrderSpeechItem:
      type: object
      additionalProperties: false
      required: [public_name, quantity]
      properties:
        public_name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_label: { type: string, maxLength: 40 }
    PrivacySafeOrderSummary:
      type: object
      additionalProperties: false
      required:
        - customer_display_name
        - order_code_short
        - items
        - total_amount
        - currency
        - delivery_area_short
        - program_display_name
        - locale
      properties:
        customer_display_name: { type: string, minLength: 1, maxLength: 80 }
        order_code_short: { type: string, minLength: 1, maxLength: 40 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSpeechItem' }
        total_amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [VND] }
        delivery_area_short:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^(?!\s*\d)(?!.*\d+\s*/\s*\d+).*$'
          description: >
            Privacy-reviewed short area only (phường/xã, quận/huyện, tỉnh/thành).
            The pattern rejects a house-number prefix (a leading digit, e.g. "123 Nguyen Hue")
            and slash-form house numbers ("12/3 Le Loi"), while still ACCEPTING legitimate
            numbered administrative units such as "Quan 7" or "Phuong 12".
            It is only the machine-enforceable half of the rule: a digit-free street address
            ("Duong Nguyen Hue, Phuong Ben Nghe") still passes the schema and MUST be rejected
            by the IVR-side semantic full-address detector at intake (FR-IVR-INTAKE-005) with
            IVR_PII_POLICY_VIOLATION. Sales remains responsible for normalising the value.
        program_display_name: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [vi-VN] }
        pronunciation_hints:
          type: object
          additionalProperties: { type: string }
    SellableStatusLine:
      type: object
      required: [sku_id, decision, captured_at]
      properties:
        sku_id: { type: string }
        batch_id: { type: string }
        decision: { type: string, enum: [SELLABLE, NOT_SELLABLE, BLOCKED, UNKNOWN] }
        recall_hold: { type: boolean }
        sale_lock: { type: boolean }
        quality_hold: { type: boolean }
        stock_available: { type: boolean }
        batch_released: { type: boolean }
        trace_ready: { type: boolean }
        captured_at: { type: string, format: date-time }
    IvrConfirmationTaskV1:
      type: object
      additionalProperties: false
      allOf:
        - oneOf:
            - properties:
                program_code: { const: GOLDEN_HOUR }
                payment_method_snapshot: { const: ONLINE }
            - properties:
                program_code: { const: TWENTY_FOUR_SEVEN }
                payment_method_snapshot: { const: COD }
      required:
        - contract_version
        - task_id
        - order_id
        - order_code
        - order_version
        - order_state
        - payment_method_snapshot
        - program_code
        - ivr_confirmation_required
        - confirmation_window_started_at
        - confirmation_window_expires_at
        - attempt_policy_version
        - max_customer_attempts
        - attempt_offsets_seconds
        - phone_ref
        - phone_masked
        - dial_token
        - dial_token_expires_at
        - privacy_safe_order_summary
        - call_restriction
        - eligibility_snapshot
        - evidence_ref
      properties:
        contract_version: { type: string, enum: [ivr-order-confirmation.v1] }
        task_id: { type: string }
        # Optional in body; the X-Correlation-Id header is the source of truth.
        # If both are present they MUST match, otherwise 422.
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        order_id: { type: string }
        order_code: { type: string }
        order_code_short: { type: string }
        order_version: { type: string, description: Required Target V1 stale-result guard snapshot. }
        order_state: { type: string, description: Opaque enum owned by Order Core (D-02) }
        payment_method_snapshot: { type: string, enum: [ONLINE, COD] }
        ivr_confirmation_required: { type: boolean, enum: [true] }
        is_ivr_callable: { type: boolean, description: Optional convenience flag; Sales remains source of truth. }
        program_code: { $ref: '#/components/schemas/ProgramCode' }
        confirmation_window_started_at: { type: string, format: date-time }
        confirmation_window_expires_at: { type: string, format: date-time }
        attempt_policy_version: { type: string }
        max_customer_attempts: { type: integer, minimum: 1, maximum: 10 }
        attempt_offsets_seconds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 0 }
        customer_ref: { type: string }
        customer_trust_status:
          type: string
          description: >-
            Sales' customer-trust label, stored for audit only. Since OD-15 it takes no
            part in the skip decision — IVR reads `risk_flags` instead — so omitting it
            never causes a call that would otherwise be skipped.
        trusted_skip_allowed:
          type: boolean
          description: >-
            A VETO, not an opt-in (OD-15). `false` forces the confirmation call for this
            order even when every other skip condition is met. `true` and absent behave
            identically. Omit the field unless you mean to veto: sending `false` as a
            blanket default suppresses the returning-customer skip on every order.
        risk_flags:
          type: array
          description: >-
            Privacy-safe risk codes Sales found on this order, for example `NEW_CUSTOMER`,
            `VERIFIED_ORDER_COUNT_0`, `COD_FAIL_HISTORY`, `SUSPICIOUS_DUPLICATE`. Any entry
            forces the call — OD-15 keeps D-12's exception that a risk flag outranks the
            returning-customer skip. An EMPTY list cancels the call only when
            `eligibility_snapshot.trust.risk_evidence_available` is `true`: on its own an
            empty list cannot be told apart from an order Sales never evaluated, and IVR
            must not read the second as "no risk". Codes carry no customer data — they
            travel into IVR evidence and admin screens.
          items: { type: string }
        phone_ref: { type: string }
        phone_masked: { type: string }
        phone_validation_status: { type: string }
        dial_token: { type: string, description: Opaque token; never a raw phone number. }
        dial_token_expires_at: { type: string, format: date-time }
        privacy_safe_order_summary: { $ref: '#/components/schemas/PrivacySafeOrderSummary' }
        # IVR-owned (P2-7 script lifecycle). Optional on the wire: if Sales omits them,
        # IVR resolves the mode-approved script version itself. Never a Sales obligation.
        call_script_template_id: { type: string }
        call_script_version: { type: string }
        allowed_script_variables:
          type: object
          additionalProperties: true
        sellable_status:
          type: array
          description: Per-line SKU/batch snapshot; Order Core fan-out (DO-02, DO-CORR-1)
          items: { $ref: '#/components/schemas/SellableStatusLine' }
        call_restriction:
          type: boolean
          description: Voice-call restriction already resolved by Sales; true blocks dispatch.
        eligibility_snapshot:
          type: object
          additionalProperties: true
          description: >
            Sales-owned eligibility evidence. The wire type stays an open object because the
            shape is not owner-approved yet (OD-V1-03). The shape IVR validates against is
            published as a linked evidence reference at
            specs/api/evidence/eligibility-snapshot.v1.schema.json: decision, source_version,
            captured_at, optional source_available and optional blockers[]. IVR fails closed on
            anything it cannot interpret rather than tightening this schema (W-0030 / P4-2).
        evidence_ref: { type: string }
        # IVR-derived policy snapshots; optional on the wire.
        evidence_policy_version: { type: string }
        privacy_policy_version: { type: string }
    IvrTaskIntakeResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: >-
            `TASK_SKIPPED_TRUSTED_CUSTOMER` reads as "returning customer, nothing on the
            order worth calling about" since OD-15; the name predates the decision and is
            kept because it is a persisted enum value. It means no CallJob was created and
            Order Core owns the continuation — it is not a failure and not a rejection.
          enum:
            - TASK_ACCEPTED_CALL_JOB_CREATED
            - TASK_ACCEPTED_DRY_RUN_ONLY
            - TASK_SKIPPED_TRUSTED_CUSTOMER
            - TASK_REJECTED_NOT_OFFICIAL_ORDER
            - TASK_REJECTED_STATE_NOT_CALLABLE
            - TASK_REJECTED_POLICY_MISMATCH
            - TASK_REJECTED_CONTACT_INVALID
            - TASK_REJECTED_SCRIPT_NOT_APPROVED
            - TASK_REJECTED_INVALID_TRACE
            - TASK_BLOCKED_OPERATIONAL
            - TASK_HELD_ADMIN_REVIEW
            - TASK_HELD_POLICY_MISSING
        ivr_call_job_id: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        evidence_ref: { type: string }
    EligibilityLifecycleRequest:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string, minLength: 1 }
    CallJobLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_job_id, task_id]
      properties:
        ivr_call_job_id: { type: string, minLength: 1 }
        task_id: { type: string, minLength: 1 }
    CallAttemptLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_attempt_id, ivr_call_job_id]
      properties:
        ivr_call_attempt_id: { type: string, minLength: 1 }
        ivr_call_job_id: { type: string, minLength: 1 }
    CallResultLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_result_id, ivr_call_job_id]
      properties:
        ivr_call_result_id: { type: string, minLength: 1 }
        ivr_call_job_id: { type: string, minLength: 1 }
