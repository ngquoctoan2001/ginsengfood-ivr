  /feature-flags/{environment}:
    get:
      tags: [admin]
      summary: Read a fresh typed feature-flag snapshot (perm IVR_FLAG_READ)
      operationId: getFeatureFlags
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Fresh snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagReadResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: Atomically mutate runtime controls (perm IVR_RUNTIME_GATE_ADMIN; OD-V1-20 pending)
      operationId: mutateFeatureFlags
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagMutationRequest' } } }
      responses:
        '200': { description: Audited mutation and verified revision, content: { application/json: { schema: { $ref: '#/components/schemas/FeatureFlagMutationResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /feature-flags/{environment}/kill-switch:
    get:
      tags: [admin]
      summary: Verify effective kill-switch state (perm IVR_FLAG_READ)
      operationId: verifyFeatureFlagKillSwitch
      parameters:
        - $ref: '#/components/parameters/FeatureFlagEnvironment'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Effective fail-closed state, content: { application/json: { schema: { $ref: '#/components/schemas/KillSwitchVerification' } } } }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service token (allowlist Order Core, DF-06) or admin session (DF-01).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: { type: string }
    SourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [sales-platform, order-core] }
    InternalSourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [ivr-worker, ivr-adapter] }
    AnalyticsProgram:
      name: program
      in: query
      required: false
      schema: { type: string, enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN] }
    AnalyticsResultType:
      name: result_type
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    AnalyticsScriptVariant:
      name: script_variant
      in: query
      required: false
      schema: { type: string, maxLength: 200 }
    AnalyticsBucket:
      name: bucket
      in: query
      required: false
      schema: { type: string, enum: [DAY, HOUR], default: DAY }
    AnalyticsDimension:
      name: dimension
      in: query
      required: false
      schema: { type: string, enum: [RESULT_TYPE, SCRIPT_VARIANT, PROGRAM], default: RESULT_TYPE }
    AnalyticsFrom:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    AnalyticsTo:
      name: to
      in: query
      required: false
      schema: { type: string, format: date-time }
    InternalServiceScope:
      name: X-Service-Scope
      in: header
      required: true
      schema: { type: string, enum: [ivr.internal.write] }
    FeatureFlagEnvironment:
      name: environment
      in: path
      required: true
      schema: { type: string, enum: [dev, staging, lab, pilot, prod] }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorCode:
      type: string
      description: Stable IVR error envelope code catalog (api/06 §1c).
      enum:
        - IVR_UNAUTHENTICATED
        - IVR_FORBIDDEN_CALLER
        - IVR_MALFORMED_REQUEST
        - IVR_MISSING_TRACE
        - IVR_IDEMPOTENCY_CONFLICT
        - IVR_VERSION_CONFLICT
        - IVR_NOT_OFFICIAL_ORDER
        - IVR_STATE_NOT_CALLABLE
        - IVR_POLICY_MISMATCH
        - IVR_CONTACT_INVALID
        - IVR_SCRIPT_NOT_APPROVED
        - IVR_PII_POLICY_VIOLATION
        - IVR_OPERATIONAL_BLOCKED
        - IVR_NOT_FOUND
        - IVR_RATE_LIMITED
        - IVR_INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
    ProgramCode:
      type: string
      enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN]
    OrderSpeechItem:
      type: object
      additionalProperties: false
      required: [public_name, quantity]
      properties:
        public_name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_label: { type: string, maxLength: 40 }
    PrivacySafeOrderSummary:
      type: object
      additionalProperties: false
      required:
        - customer_display_name
        - order_code_short
        - items
        - total_amount
        - currency
        - delivery_area_short
        - program_display_name
        - locale
      properties:
        customer_display_name: { type: string, minLength: 1, maxLength: 80 }
        order_code_short: { type: string, minLength: 1, maxLength: 40 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderSpeechItem' }
        total_amount: { type: number, minimum: 0 }
        currency: { type: string, enum: [VND] }
        delivery_area_short:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^(?!\s*\d)(?!.*\d+\s*/\s*\d+).*$'
          description: >
            Privacy-reviewed short area only (phường/xã, quận/huyện, tỉnh/thành).
            The pattern rejects a house-number prefix (a leading digit, e.g. "123 Nguyen Hue")
            and slash-form house numbers ("12/3 Le Loi"), while still ACCEPTING legitimate
            numbered administrative units such as "Quan 7" or "Phuong 12".
            It is only the machine-enforceable half of the rule: a digit-free street address
            ("Duong Nguyen Hue, Phuong Ben Nghe") still passes the schema and MUST be rejected
            by the IVR-side semantic full-address detector at intake (FR-IVR-INTAKE-005) with
            IVR_PII_POLICY_VIOLATION. Sales remains responsible for normalising the value.
        program_display_name: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [vi-VN] }
        pronunciation_hints:
          type: object
          additionalProperties: { type: string }
    SellableStatusLine:
      type: object
      required: [sku_id, decision, captured_at]
      properties:
        sku_id: { type: string }
        batch_id: { type: string }
        decision: { type: string, enum: [SELLABLE, NOT_SELLABLE, BLOCKED, UNKNOWN] }
        recall_hold: { type: boolean }
        sale_lock: { type: boolean }
        quality_hold: { type: boolean }
        stock_available: { type: boolean }
        batch_released: { type: boolean }
        trace_ready: { type: boolean }
        captured_at: { type: string, format: date-time }
    IvrConfirmationTaskV1:
      type: object
      additionalProperties: false
      allOf:
        - oneOf:
            - properties:
                program_code: { const: GOLDEN_HOUR }
                payment_method_snapshot: { const: ONLINE }
            - properties:
                program_code: { const: TWENTY_FOUR_SEVEN }
                payment_method_snapshot: { const: COD }
      required:
        - contract_version
        - task_id
        - order_id
        - order_code
        - order_version
        - order_state
        - payment_method_snapshot
        - program_code
        - ivr_confirmation_required
        - confirmation_window_started_at
        - confirmation_window_expires_at
        - attempt_policy_version
        - max_customer_attempts
        - attempt_offsets_seconds
        - phone_ref
        - phone_masked
        - dial_token
        - dial_token_expires_at
        - privacy_safe_order_summary
        - call_restriction
        - eligibility_snapshot
        - evidence_ref
      properties:
        contract_version: { type: string, enum: [ivr-order-confirmation.v1] }
        task_id: { type: string }
        # Optional in body; the X-Correlation-Id header is the source of truth.
        # If both are present they MUST match, otherwise 422.
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        order_id: { type: string }
        order_code: { type: string }
        order_code_short: { type: string }
        order_version: { type: string, description: Required Target V1 stale-result guard snapshot. }
        order_state: { type: string, description: Opaque enum owned by Order Core (D-02) }
        payment_method_snapshot: { type: string, enum: [ONLINE, COD] }
        ivr_confirmation_required: { type: boolean, enum: [true] }
        is_ivr_callable: { type: boolean, description: Optional convenience flag; Sales remains source of truth. }
        program_code: { $ref: '#/components/schemas/ProgramCode' }
        confirmation_window_started_at: { type: string, format: date-time }
        confirmation_window_expires_at: { type: string, format: date-time }
        attempt_policy_version: { type: string }
        max_customer_attempts: { type: integer, minimum: 1, maximum: 10 }
        attempt_offsets_seconds:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: integer, minimum: 0 }
        customer_ref: { type: string }
        customer_trust_status: { type: string }
        trusted_skip_allowed: { type: boolean }
        risk_flags:
          type: array
          items: { type: string }
        phone_ref: { type: string }
        phone_masked: { type: string }
        phone_validation_status: { type: string }
        dial_token: { type: string, description: Opaque token; never a raw phone number. }
        dial_token_expires_at: { type: string, format: date-time }
        privacy_safe_order_summary: { $ref: '#/components/schemas/PrivacySafeOrderSummary' }
        # IVR-owned (P2-7 script lifecycle). Optional on the wire: if Sales omits them,
        # IVR resolves the mode-approved script version itself. Never a Sales obligation.
        call_script_template_id: { type: string }
        call_script_version: { type: string }
        allowed_script_variables:
          type: object
          additionalProperties: true
        sellable_status:
          type: array
          description: Per-line SKU/batch snapshot; Order Core fan-out (DO-02, DO-CORR-1)
          items: { $ref: '#/components/schemas/SellableStatusLine' }
        call_restriction:
          type: boolean
          description: Voice-call restriction already resolved by Sales; true blocks dispatch.
        eligibility_snapshot:
          type: object
          additionalProperties: true
          description: >
            Sales-owned eligibility evidence. The wire type stays an open object because the
            shape is not owner-approved yet (OD-V1-03). The shape IVR validates against is
            published as a linked evidence reference at
            specs/api/evidence/eligibility-snapshot.v1.schema.json: decision, source_version,
            captured_at, optional source_available and optional blockers[]. IVR fails closed on
            anything it cannot interpret rather than tightening this schema (W-0030 / P4-2).
        evidence_ref: { type: string }
        # IVR-derived policy snapshots; optional on the wire.
        evidence_policy_version: { type: string }
        privacy_policy_version: { type: string }
    IvrTaskIntakeResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum:
            - TASK_ACCEPTED_CALL_JOB_CREATED
            - TASK_ACCEPTED_DRY_RUN_ONLY
            - TASK_SKIPPED_TRUSTED_CUSTOMER
            - TASK_REJECTED_NOT_OFFICIAL_ORDER
            - TASK_REJECTED_STATE_NOT_CALLABLE
            - TASK_REJECTED_POLICY_MISMATCH
            - TASK_REJECTED_CONTACT_INVALID
            - TASK_REJECTED_SCRIPT_NOT_APPROVED
            - TASK_REJECTED_INVALID_TRACE
            - TASK_BLOCKED_OPERATIONAL
            - TASK_HELD_ADMIN_REVIEW
            - TASK_HELD_POLICY_MISSING
        ivr_call_job_id: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        evidence_ref: { type: string }
    EligibilityLifecycleRequest:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string, minLength: 1 }
    CallJobLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_job_id, task_id]
      properties:
        ivr_call_job_id: { type: string, minLength: 1 }
        task_id: { type: string, minLength: 1 }
    CallAttemptLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_attempt_id, ivr_call_job_id]
      properties:
        ivr_call_attempt_id: { type: string, minLength: 1 }
        ivr_call_job_id: { type: string, minLength: 1 }
    CallResultLifecycleRequest:
      type: object
      additionalProperties: false
      required: [ivr_call_result_id, ivr_call_job_id]
      properties:
        ivr_call_result_id: { type: string, minLength: 1 }
        ivr_call_job_id: { type: string, minLength: 1 }
    ResultCallbackLifecycleRequest:
      type: object
      additionalProperties: false
      required: [callback_id, ivr_call_result_id]
      properties:
        callback_id: { type: string, minLength: 1 }
        ivr_call_result_id: { type: string, minLength: 1 }
    AdminMutationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidence_ref: { type: string }
    TechnicalRetryRequest:
      type: object
      additionalProperties: false
      required: [technical_exception_id, target_attempt_id, reason]
      properties:
        technical_exception_id: { type: string, minLength: 1 }
        target_attempt_id: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidence_ref: { type: string }
    AdminReviewRequest:
      type: object
      additionalProperties: false
      required: [review_item_id, resolution, reason]
      properties:
        review_item_id: { type: string, minLength: 1 }
        resolution: { type: string, minLength: 1, maxLength: 500 }
        reason: { type: string, minLength: 1, maxLength: 500 }
        evidence_ref: { type: string }
    IvrEligibilityDecision:
      type: object
      additionalProperties: false
      required: [task_id, decision, blocked_reasons, evidence_ref]
      properties:
        task_id: { type: string }
        decision: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        skip_trusted: { type: boolean }
        evidence_ref: { type: string }
    IvrCallJob:
      type: object
      additionalProperties: false
      required:
        - ivr_call_job_id
        - task_id
        - program_type
        - status
        - queue_status
        - eligible
        - max_attempts
        - expires_at
        - input_signal_only
        - no_direct_order_update
      properties:
        ivr_call_job_id: { type: string }
        task_id: { type: string }
        official_order_id: { type: string }
        order_version: { type: string, description: Required Target V1 snapshot. }
        program_type: { $ref: '#/components/schemas/ProgramCode' }
        status: { type: string }
        attempt_policy_version: { type: string }
        max_attempts: { type: integer, minimum: 1, maximum: 10 }
        attempt_spacing_seconds: { type: integer }
        confirmation_window_seconds: { type: integer, minimum: 1 }
        queue_status: { type: string }
        eligible: { type: boolean }
        expires_at: { type: string, format: date-time }
        input_signal_only: { type: boolean, enum: [true] }
        no_direct_order_update: { type: boolean, enum: [true] }
    IvrCallAttempt:
      type: object
      additionalProperties: false
      required:
        - ivr_call_attempt_id
        - ivr_call_job_id
        - attempt_number
        - status
        - is_counted_customer_attempt
        - technical_retry_count
      properties:
        ivr_call_attempt_id: { type: string }
        ivr_call_job_id: { type: string }
        attempt_number: { type: integer, minimum: 1, maximum: 10 }
        status: { type: string }
        result_status: { type: string }
        dtmf_key: { type: string }
        is_counted_customer_attempt: { type: boolean }
        technical_retry_count: { type: integer, minimum: 0 }
        disposition: { type: string }
        sim_channel_id: { type: string }
    IvrCallResult:
      type: object
      additionalProperties: false
      required:
        - ivr_call_result_id
        - ivr_call_job_id
        - result_type
        - is_counted_customer_attempt
        - is_final_for_ivr
        - recommended_core_action
        - input_signal_only
        - no_direct_order_update
        - no_payment_or_revenue_effect
      properties:
        ivr_call_result_id: { type: string }
        ivr_call_job_id: { type: string }
        final_result_status: { type: string }
        result_reason: { type: string }
        result_type: { $ref: '#/components/schemas/ResultType' }
        is_counted_customer_attempt: { type: boolean }
        is_final_for_ivr: { type: boolean }
        recommended_core_action: { type: string }
        input_signal_only: { type: boolean, enum: [true] }
        no_direct_order_update: { type: boolean, enum: [true] }
        no_payment_or_revenue_effect: { type: boolean, enum: [true] }
    ResultType:
      type: string
      enum:
        - IVR_CONFIRMED
        - IVR_CUSTOMER_CANCELLED
        - IVR_NO_ANSWER_ATTEMPT
        - IVR_NO_ANSWER_FINAL
        - IVR_CONFIRMATION_WINDOW_EXPIRED
        - IVR_INVALID_PHONE_FINAL
        - IVR_WRONG_INPUT
        - IVR_TECHNICAL_EXCEPTION
        - IVR_CAPACITY_EXCEPTION
        - IVR_OPERATIONAL_BLOCKED
        - IVR_POLICY_BLOCKED
    IvrResultCallbackLifecycle:
      type: object
      additionalProperties: false
      required:
        - callback_id
        - ivr_call_result_id
        - result_state
        - delivery_status
        - retry_count
        - requires_core_revalidation
      properties:
        callback_id: { type: string }
        ivr_call_result_id: { type: string }
        result_state: { type: string }
        delivery_status: { type: string }
        retry_count: { type: integer, minimum: 0 }
