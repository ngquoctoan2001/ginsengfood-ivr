openapi: 3.1.0
info:
  title: IVR Order Confirmation — Internal/Admin API (Target V1 Draft)
  version: 1.0.0-draft.8
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    Target V1 draft for the standalone .NET IVR service. Not a public API. The
    Sales Platform owns eligibility, revalidation, and order-state transitions.
    Supports GOLDEN_HOUR+ONLINE and TWENTY_FOUR_SEVEN+COD. External Sales callback
    is specified separately in order-core-ivr-callback.target-v1.yaml.
servers:
  - url: /v1/ivr/order-confirmation
    description: Internal base path
security:
  - bearerAuth: []
tags:
  - name: internal
    description: Service-to-service operations owned by the standalone IVR service.
  - name: admin
    description: Masked, permission-gated operator controls and projections.
paths:
  /tasks:
    post:
      tags: [internal]
      summary: Task intake (Order Core -> IVR, push sync)
      operationId: intakeTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IvrConfirmationTaskV1' }
      responses:
        '200': { description: Intake decision, content: { application/json: { schema: { $ref: '#/components/schemas/IvrTaskIntakeResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /eligibility-checks:
    post:
      tags: [internal]
      summary: Persist eligibility decision
      operationId: recordEligibility
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EligibilityLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrEligibilityDecision' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs:
    post:
      tags: [internal]
      summary: Create/record CallJob
      operationId: createCallJob
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallJobLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    get:
      tags: [admin]
      summary: Call-job list, masked and paginated (perm IVR_QUEUE_VIEW)
      description: >-
        `order_code` is a filter input only and is never echoed; the response
        carries the script-approved `order_code_short` (D-05, specs/ui/02).
      operationId: listCallJobs
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: program, in: query, required: false, schema: { $ref: '#/components/schemas/ProgramCode' } }
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: queue_status, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: result_type, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: order_code, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: correlation_id, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: near_expiry, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJobPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}:
    get:
      tags: [internal]
      summary: Read CallJob (masked)
      operationId: getCallJob
      parameters:
        - name: ivrCallJobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-attempts:
    post:
      tags: [internal]
      summary: Record call attempt
      operationId: recordAttempt
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallAttemptLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallAttempt' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-results:
    post:
      tags: [internal]
      summary: Record normalized result
      operationId: recordResult
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallResultLifecycleRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /result-callbacks:
    post:
      tags: [internal]
      summary: Record callback lifecycle (delivery to Order Core is outbound)
      operationId: recordResultCallback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/InternalSourceSystem'
        - $ref: '#/components/parameters/InternalServiceScope'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResultCallbackLifecycleRequest' } } }
      responses:
        '200': { description: Recorded internal delivery lifecycle, content: { application/json: { schema: { $ref: '#/components/schemas/IvrResultCallbackLifecycle' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:
    get:
      tags: [admin]
      summary: Queue/capacity projection (masked)
      operationId: getQueue
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrQueueProjection' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /dashboard:
    get:
      tags: [admin]
      summary: Operational dashboard projection, masked (perm IVR_QUEUE_VIEW)
      description: >-
        Aggregates are computed server-side so the console never derives a KPI
        from raw rows. SIM pool and open incidents are pool-wide and ignore the
        program/time filter.
      operationId: getDashboard
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: program, in: query, required: false, schema: { $ref: '#/components/schemas/ProgramCode' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrDashboardProjection' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}/detail:
    get:
      tags: [admin]
      summary: Full masked lifecycle trace for one call job (perm IVR_QUEUE_VIEW)
      description: >-
        task intake to eligibility to attempts to result to callback, plus the
        technical-exception and review-item ids the admin mutations require.
        `order_state` is the opaque Core enum; IVR displays it and never changes
        it (D-02).
      operationId: getCallJobDetail
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: ivrCallJobId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJobDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /sim-channels:
    get:
      tags: [admin]
      summary: SIM channel roster, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        The roster behind the dashboard SIM panel, so the enable/disable
        operations in specs/ui/08 §3 have a console surface. `sim_number_ref` is
        deliberately not projected: it points at a phone identity the console has
        no use for (D-05). Lease internals are omitted as scheduler mechanics.
      operationId: listSimChannels
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrSimChannelList' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /scripts:
    get:
      tags: [admin]
      summary: Call-script catalogue, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        Versions with their approval matrix, the allowed and prohibited variable
        lists, and the DTMF map. KEY_9 is reported NOT_ENABLED (AS-07). Lifecycle
        transitions are not exposed: approval is an owner action under OD-V1-15,
        not a console button.
      operationId: getScriptCatalog
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrScriptCatalog' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /integration-status:
    get:
      tags: [admin]
      summary: Downstream dependency status, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        Reports what IVR can observe about itself and marks every unprobed
        dependency NOT_WIRED. `dependency_probing_available` stays false until
        P6-1 (W-0040) delivers real probing, so no card may be read as verified
        fail-closed before then.
      operationId: getIntegrationStatus
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: environment, in: query, required: false, schema: { type: string, maxLength: 40 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrIntegrationStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /review-items:
    get:
      tags: [admin]
      summary: Human review queue, masked and paginated (perm IVR_QUEUE_VIEW)
      operationId: listReviewItems
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: status, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrReviewQueue' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /analytics/summary:
    get:
      tags: [admin]
      summary: Aggregate reporting KPI summary, read-only (perm IVR_QUEUE_VIEW)
      description: >-
        Business KPI over the filtered scope plus the result-taxonomy split. Every
        value is a count or a rate; no task, order code, phone or evidence ref is
        projected (D-05). Buckets below `min_bucket_size` are dropped server-side
        and reported in `data_quality.suppressed_bucket_count`. `data_quality.source`
        names the store that answered, and `data_quality.warehouse_status` reports
        whether the P10-4 pipeline (W-0055) is complete or still catching up.
      operationId: getAnalyticsSummary
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/AnalyticsProgram'
        - $ref: '#/components/parameters/AnalyticsResultType'
        - $ref: '#/components/parameters/AnalyticsScriptVariant'
        - $ref: '#/components/parameters/AnalyticsBucket'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAnalyticsSummary' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /analytics/trend:
    get:
      tags: [admin]
      summary: Aggregate trend series per time bucket and program (perm IVR_QUEUE_VIEW)
      description: >-
        A bucket holding fewer than `min_bucket_size` results is omitted from the
        series rather than returned with zeroed counts, because a zero row reads
        as "no calls" and that would be a false statement.
      operationId: getAnalyticsTrend
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/AnalyticsProgram'
        - $ref: '#/components/parameters/AnalyticsResultType'
        - $ref: '#/components/parameters/AnalyticsScriptVariant'
        - $ref: '#/components/parameters/AnalyticsBucket'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAnalyticsTrend' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /analytics/breakdown:
    get:
      tags: [admin]
      summary: Aggregate breakdown by result type, script variant or program (perm IVR_QUEUE_VIEW)
      operationId: getAnalyticsBreakdown
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/AnalyticsDimension'
        - $ref: '#/components/parameters/AnalyticsProgram'
        - $ref: '#/components/parameters/AnalyticsResultType'
        - $ref: '#/components/parameters/AnalyticsScriptVariant'
        - $ref: '#/components/parameters/AnalyticsBucket'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAnalyticsBreakdown' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /analytics/export:
    get:
      tags: [admin]
      summary: Sanitized aggregate extract with mandatory reason (perm IVR_QUEUE_VIEW)
      description: >-
        Returns a column-oriented aggregate extract. `reason` is mandatory and is
        written to the audit log with the resolved filter and row counts. Rows
        below `min_bucket_size` are excluded; when data exists but nothing
        survives suppression the export is refused with
        `IVR_PII_POLICY_VIOLATION` rather than returned empty. This is a GET
        because it is a read that is audited, not a state change.
      operationId: exportAnalytics
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
        - $ref: '#/components/parameters/AnalyticsDimension'
        - $ref: '#/components/parameters/AnalyticsProgram'
        - $ref: '#/components/parameters/AnalyticsResultType'
        - $ref: '#/components/parameters/AnalyticsScriptVariant'
        - $ref: '#/components/parameters/AnalyticsBucket'
        - $ref: '#/components/parameters/AnalyticsFrom'
        - $ref: '#/components/parameters/AnalyticsTo'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAnalyticsExport' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:pause:
    post:
      tags: [admin]
      summary: Pause queue (perm IVR_QUEUE_PAUSE)
      operationId: pauseQueue
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /queue:resume:
    post:
      tags: [admin]
