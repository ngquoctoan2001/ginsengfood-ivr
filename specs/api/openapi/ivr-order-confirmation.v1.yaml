openapi: 3.1.0
info:
  title: IVR Order Confirmation — Internal/Admin API
  version: 1.0.0
  description: >
    Internal + admin API for IVR Order Confirmation (Module 8 / PACK-09 / phase-8).
    NOT a public consumer API. IVR result is an input signal only; Order Core owns
    order-state transitions. Locked decisions: see plan/ivr-orther/decisions-log.md
    (D-*, DO-*, DF-*, DT-*). REAL_CUSTOMER_CALL_ALLOWED=NO until release gate (DF-03).
servers:
  - url: /v1/ivr/order-confirmation
    description: Internal base path
security:
  - bearerAuth: []
tags:
  - name: internal
  - name: admin
paths:
  /tasks:
    post:
      tags: [internal]
      summary: Task intake (Order Core -> IVR, push sync)
      operationId: intakeTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IvrConfirmationTaskV1' }
      responses:
        '200': { description: Intake decision, content: { application/json: { schema: { $ref: '#/components/schemas/IvrTaskIntakeResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /eligibility-checks:
    post:
      tags: [internal]
      summary: Persist eligibility decision
      operationId: recordEligibility
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrEligibilityDecision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrEligibilityDecision' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /call-jobs:
    post:
      tags: [internal]
      summary: Create/record CallJob
      operationId: createCallJob
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
  /call-jobs/{ivrCallJobId}:
    get:
      tags: [internal]
      summary: Read CallJob (masked)
      operationId: getCallJob
      parameters:
        - name: ivrCallJobId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /call-attempts:
    post:
      tags: [internal]
      summary: Record call attempt
      operationId: recordAttempt
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallAttempt' } } }
      responses:
        '200': { description: OK }
  /call-results:
    post:
      tags: [internal]
      summary: Record normalized result
      operationId: recordResult
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrCallResult' } } }
      responses:
        '200': { description: OK }
  /result-callbacks:
    post:
      tags: [internal]
      summary: Record callback lifecycle (delivery to Order Core is outbound)
      operationId: recordResultCallback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrConfirmationResultCallbackCurrentV1' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CallbackCoreResponseCurrent' } } } }
  /queue:
    get:
      tags: [admin]
      summary: Queue/capacity projection (masked)
      operationId: getQueue
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /queue:pause:
    post:
      tags: [admin]
      summary: Pause queue (perm IVR_QUEUE_PAUSE)
      operationId: pauseQueue
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminAction' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /queue:resume:
    post:
      tags: [admin]
      summary: Resume queue (perm IVR_QUEUE_RESUME)
      operationId: resumeQueue
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminAction' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /sim-channels/{simChannelId}:disable:
    post:
      tags: [admin]
      summary: Disable SIM channel (perm IVR_SIM_DISABLE)
      operationId: disableSim
      parameters:
        - name: simChannelId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminAction' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /sim-channels/{simChannelId}:enable:
    post:
      tags: [admin]
      summary: Enable SIM channel after health pass (perm IVR_SIM_ENABLE)
      operationId: enableSim
      parameters:
        - name: simChannelId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminAction' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /technical-retries:
    post:
      tags: [admin]
      summary: Request technical retry (perm IVR_MANUAL_RETRY; not a customer attempt)
      operationId: technicalRetry
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrTechnicalException' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
  /admin-reviews:
    post:
      tags: [admin]
      summary: Record review/annotation (perm IVR_RESULT_REVIEW)
      operationId: adminReview
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminAction' } } }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Service token (allowlist Order Core, DF-06) or admin session (DF-01).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema: { type: string }
    SourceSystem:
      name: X-Source-System
      in: header
      required: true
      schema: { type: string, enum: [order-core] }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorCode:
      type: string
      description: Stable IVR error envelope code catalog (api/06 §1c).
      enum:
        - IVR_UNAUTHENTICATED
        - IVR_FORBIDDEN_CALLER
        - IVR_MALFORMED_REQUEST
        - IVR_MISSING_TRACE
        - IVR_IDEMPOTENCY_CONFLICT
        - IVR_VERSION_CONFLICT
        - IVR_NOT_OFFICIAL_ORDER
        - IVR_STATE_NOT_CALLABLE
        - IVR_POLICY_MISMATCH
        - IVR_CONTACT_INVALID
        - IVR_SCRIPT_NOT_APPROVED
        - IVR_OPERATIONAL_BLOCKED
        - IVR_NOT_FOUND
        - IVR_RATE_LIMITED
        - IVR_INTERNAL_ERROR
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
    ProgramCode:
      type: string
      enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN]
    SellableStatusLine:
      type: object
      required: [sku_id, decision, captured_at]
      properties:
        sku_id: { type: string }
        batch_id: { type: string }
        decision: { type: string, enum: [SELLABLE, NOT_SELLABLE, BLOCKED, UNKNOWN] }
        recall_hold: { type: boolean }
        sale_lock: { type: boolean }
        quality_hold: { type: boolean }
        stock_available: { type: boolean }
        batch_released: { type: boolean }
        trace_ready: { type: boolean }
        captured_at: { type: string, format: date-time }
    IvrConfirmationTaskV1:
      type: object
      required:
        - task_id
        - task_version
        - correlation_id
        - order_id
        - order_code
        - order_state
        - payment_method_snapshot
        - program_code
        - max_attempts
        - confirmation_window_seconds
        - attempt_schedule
        - official_contact_id
        - phone_ref
        - phone_masked
        - phone_validation_status
        - call_script_template_id
        - call_script_version
        - sellable_status
        - evidence_policy_version
        - privacy_policy_version
      properties:
        task_id: { type: string }
        task_version: { type: string, enum: [v1] }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        order_id: { type: string }
        order_code: { type: string }
        order_code_short: { type: string }
        order_version: { type: string, description: Target IR-SALES-OC1; optional/current may be absent because DS-04 is not exposed yet. }
        order_state: { type: string, description: Opaque enum owned by Order Core (D-02) }
        payment_method_snapshot: { type: string, enum: [COD], description: COD-only IVR gate (DS-01); no payment processing in IVR. }
        is_ivr_callable: { type: boolean, description: Optional convenience flag derived by Core from CONFIRMING+COD; IVR must not treat it as source-of-truth. }
        program_code: { $ref: '#/components/schemas/ProgramCode' }
        max_attempts: { type: integer, enum: [2] }
        confirmation_window_seconds: { type: integer, enum: [300, 900] }
        attempt_schedule:
          type: array
          items: { type: string }
        customer_ref: { type: string }
        customer_trust_status: { type: string }
        trusted_skip_allowed: { type: boolean }
        risk_flags:
          type: array
          items: { type: string }
        official_contact_id: { type: string }
        phone_ref: { type: string }
        phone_masked: { type: string }
        phone_validation_status: { type: string }
        dial_token: { type: string, description: TTL <= window, one-use per attempt (D-05) }
        call_script_template_id: { type: string }
        call_script_version: { type: string }
        allowed_script_variables:
          type: object
          additionalProperties: true
        sellable_status:
          type: array
          description: Per-line SKU/batch snapshot; Order Core fan-out (DO-02, DO-CORR-1)
          items: { $ref: '#/components/schemas/SellableStatusLine' }
        call_restriction:
          type: boolean
          description: do-not-call/opt-out from CRM Customer Identity (DC-01); rich fields/Core wiring tracked by IR-CRM-01
        evidence_policy_version: { type: string }
        privacy_policy_version: { type: string }
    IvrTaskIntakeResult:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum:
            - TASK_ACCEPTED_CALL_JOB_CREATED
            - TASK_ACCEPTED_DRY_RUN_ONLY
            - TASK_SKIPPED_TRUSTED_CUSTOMER
            - TASK_REJECTED_NOT_OFFICIAL_ORDER
            - TASK_REJECTED_STATE_NOT_CALLABLE
            - TASK_REJECTED_POLICY_MISMATCH
            - TASK_REJECTED_CONTACT_INVALID
            - TASK_REJECTED_SCRIPT_NOT_APPROVED
            - TASK_REJECTED_INVALID_TRACE
            - TASK_BLOCKED_OPERATIONAL
            - TASK_HELD_ADMIN_REVIEW
            - TASK_HELD_POLICY_MISSING
        ivr_call_job_id: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        evidence_ref: { type: string }
    IvrEligibilityDecision:
      type: object
      required: [decision]
      properties:
        task_id: { type: string }
        decision: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        skip_trusted: { type: boolean }
        evidence_ref: { type: string }
    IvrCallJob:
      type: object
      properties:
        ivr_call_job_id: { type: string }
        task_id: { type: string }
        official_order_id: { type: string }
        order_version: { type: string, description: Optional target snapshot for IR-SALES-OC1 race guard. }
        program_type: { $ref: '#/components/schemas/ProgramCode' }
        status: { type: string }
        max_attempts: { type: integer, enum: [2] }
        attempt_spacing_seconds: { type: integer }
        confirmation_window_seconds: { type: integer, enum: [300, 900] }
        queue_status: { type: string }
        input_signal_only: { type: boolean, enum: [true] }
        no_direct_order_update: { type: boolean, enum: [true] }
    IvrCallAttempt:
      type: object
      properties:
        ivr_call_attempt_id: { type: string }
        ivr_call_job_id: { type: string }
        attempt_number: { type: integer, minimum: 1, maximum: 2 }
        status: { type: string }
        result_status: { type: string }
        dtmf_key: { type: string }
        is_counted_customer_attempt: { type: boolean }
        disposition: { type: string }
        sim_channel_id: { type: string }
    IvrCallResult:
      type: object
      properties:
        ivr_call_result_id: { type: string }
        ivr_call_job_id: { type: string }
        final_result_status: { type: string }
        result_type: { $ref: '#/components/schemas/ResultType' }
        is_counted_customer_attempt: { type: boolean }
        is_final_for_ivr: { type: boolean }
        recommended_core_action: { type: string }
        input_signal_only: { type: boolean, enum: [true] }
        no_direct_order_update: { type: boolean, enum: [true] }
        no_payment_or_revenue_effect: { type: boolean, enum: [true] }
    ResultType:
      type: string
      enum:
        - IVR_CONFIRMED
        - IVR_CUSTOMER_CANCELLED
        - IVR_NO_ANSWER_ATTEMPT
        - IVR_NO_ANSWER_FINAL
        - IVR_CONFIRMATION_WINDOW_EXPIRED
        - IVR_INVALID_PHONE_FINAL
        - IVR_WRONG_INPUT
        - IVR_TECHNICAL_EXCEPTION
        - IVR_CAPACITY_EXCEPTION
        - IVR_OPERATIONAL_BLOCKED
    IvrConfirmationResultCallbackCurrentV1:
      type: object
      description: >
        Current DS-03/DS-04 compatible callback record. Order Core currently accepts
        result only while order is CONFIRMING+COD and rejects invalid/stale-by-state
        cases with HTTP 422. It does not receive order_version_seen_by_ivr yet.
      required:
        - callback_id
        - task_id
        - order_id
        - result_type
        - is_counted_customer_attempt
        - is_final_for_ivr
        - recommended_core_action
        - evidence_ref
        - audit_ref
      properties:
        callback_id: { type: string }
        task_id: { type: string }
        call_job_id: { type: string }
        attempt_id: { type: string }
        order_id: { type: string }
        program_code: { $ref: '#/components/schemas/ProgramCode' }
        attempt_no: { type: integer, minimum: 1, maximum: 2 }
        max_attempts: { type: integer, enum: [2] }
        result_type: { $ref: '#/components/schemas/ResultType' }
        result_reason: { type: string }
        dtmf_key: { type: string }
        is_counted_customer_attempt: { type: boolean }
        is_final_for_ivr: { type: boolean }
        recommended_core_action:
          type: string
          enum:
            - CORE_REVALIDATE_AND_CONFIRM_ORDER
            - CORE_REVALIDATE_AND_CANCEL_CUSTOMER_REQUEST
            - CORE_REVALIDATE_AND_CANCEL_NO_ANSWER
            - CORE_REVALIDATE_AND_EXPIRE_CONFIRMATION
            - CORE_REVALIDATE_AND_HOLD_ADMIN_REVIEW
            - CORE_IGNORE_STALE_CALLBACK
            - CORE_BLOCK_DUE_TO_OPERATIONAL_CONSTRAINT
        technical_error_code: { type: string }
        evidence_ref: { type: string }
        audit_ref: { type: string }
        privacy_policy_version: { type: string }
        script_version: { type: string }
        created_at: { type: string, format: date-time }
    IvrConfirmationResultCallbackTargetV1:
      description: >
        Target callback payload for IR-SALES-OC1. Adds order_version_seen_by_ivr
        so Order Core can reject version-stale callbacks explicitly.
      allOf:
        - $ref: '#/components/schemas/IvrConfirmationResultCallbackCurrentV1'
        - type: object
          required:
            - order_version_seen_by_ivr
          properties:
            order_version_seen_by_ivr:
              type: string
              description: Target race-guard field; current Order Core does not accept it yet.
    IvrConfirmationResultCallbackV1:
      description: >
        Compatibility alias for the target callback contract. For implemented/current
        behavior use IvrConfirmationResultCallbackCurrentV1; for race-guard target
        behavior use IvrConfirmationResultCallbackTargetV1.
      allOf:
        - $ref: '#/components/schemas/IvrConfirmationResultCallbackTargetV1'
    CallbackCoreResponseCurrent:
      type: object
      description: >
        Current DS-03 Order Core behavior: accept with HTTP 200 or reject invalid
        state/COD cases with HTTP 422. No semantic CALLBACK_* code is guaranteed yet.
      required: [http_status]
      properties:
        http_status:
          type: integer
          enum: [200, 422]
        detail: { type: string }
    CallbackCoreResponseTarget:
      type: object
      description: Target semantic callback response for IR-SALES-OC2.
      required: [core_response_code]
      properties:
        core_response_code:
          type: string
          enum:
            - CALLBACK_ACCEPTED_FOR_REVALIDATION
            - CALLBACK_REJECTED_STALE
            - CALLBACK_BLOCKED_BY_CORE
            - CALLBACK_NEEDS_ADMIN_REVIEW
            - CALLBACK_TECHNICAL_RETRY_ALLOWED
            - CALLBACK_TECHNICAL_RETRY_BLOCKED
    CallbackCoreResponse:
      description: Compatibility alias for the target semantic callback response.
      allOf:
        - $ref: '#/components/schemas/CallbackCoreResponseTarget'
    IvrAdminAction:
      type: object
      required: [action_type, reason, target_type, target_id, no_policy_bypass]
      properties:
        action_type: { type: string }
        reason: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        evidence_ref: { type: string }
        no_policy_bypass: { type: boolean, enum: [true] }
    IvrTechnicalException:
      type: object
      required: [exception_type, customer_attempt_counted]
      properties:
        exception_type: { type: string }
        customer_attempt_counted: { type: boolean, enum: [false] }
        technical_retry_allowed: { type: boolean }
        target_attempt_id: { type: string }
        reason: { type: string }
