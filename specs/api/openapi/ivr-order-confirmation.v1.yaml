        reason: { type: string }
        status: { type: string }
        resolution: { type: string }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    IvrCallJobDetail:
      type: object
      additionalProperties: false
      required:
        - ivr_call_job_id
        - task_id
        - order_code_short
        - phone_masked
        - program_type
        - order_state
        - order_version_snapshot
        - status
        - queue_status
        - eligible
        - eligibility_decision
        - blocked_reasons
        - call_restriction
        - sellable_status
        - max_attempts
        - attempt_policy_code
        - script_version
        - privacy_policy_version
        - t0_at
        - expires_at
        - created_at
        - attempts
        - results
        - callbacks
        - technical_exceptions
        - review_items
        - evidence_refs
        - audit_refs
        - correlation_id
        - input_signal_only
        - no_direct_order_update
      properties:
        ivr_call_job_id: { type: string }
        task_id: { type: string }
        order_code_short: { type: string, maxLength: 40 }
        phone_masked: { type: string }
        program_type: { $ref: '#/components/schemas/ProgramCode' }
        order_state:
          type: string
          description: Opaque enum owned by Order Core (D-02); displayed, never derived.
        order_version_snapshot: { type: string }
        status: { type: string }
        queue_status: { type: string }
        eligible: { type: boolean }
        eligibility_decision: { type: string }
        blocked_reasons:
          type: array
          items: { type: string }
        call_restriction: { type: boolean }
        sellable_captured_at: { type: string, format: date-time }
        sellable_status:
          type: array
          description: Per-line snapshot captured at intake; never re-evaluated by IVR (DO-02).
          items: { $ref: '#/components/schemas/SellableStatusLine' }
        voice_region:
          type: string
          enum: [North, Central, South]
          description: >
            W-0106. Region the stored delivery area maps to under the 34 provincial units of
            Nghi quyet 202/2025/QH15, and therefore which regional voice this order routes to.
            Absent when the delivery area names no recognisable province.

            W-0113 CHANGED WHERE THIS COMES FROM. It is now read from the attempt that dialled
            whenever one recorded a voice, and only otherwise derived from the stored
            privacy-safe summary. Read voice_region_source to know which of the two you have.

            The derived answer is a function of TODAY'S configuration: the regional voice map
            and its fallback live in config, so a change between the call and this read makes
            the derived value describe a voice nobody heard. Nothing about that failure is
            visible in the value itself, which is why the provenance is a separate field rather
            than a footnote.

            The raw delivery area itself is NOT exposed here. A three-value region is far less
            identifying than a ward-and-province string, and the console does not need the
            latter to know which voice a customer heard.
        voice_region_source:
          type: [string, "null"]
          enum: [RECORDED, DERIVED]
          description: >
            W-0113. RECORDED when voice_region comes from the attempt row, DERIVED when it was
            computed from the stored delivery area. Null when there is no region at all.

            A separate field rather than a suffix on the value, so a screen that ignores
            provenance still shows a correct region and one that cares can refuse to put a
            derived number into something an owner signs.
        max_attempts: { type: integer, minimum: 0 }
        attempt_policy_code: { type: string }
        script_version: { type: string }
        privacy_policy_version: { type: string }
        t0_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        closed_reason: { type: string }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/IvrCallAttemptDetail' }
        results:
          type: array
          items: { $ref: '#/components/schemas/IvrCallResultDetail' }
        callbacks:
          type: array
          items: { $ref: '#/components/schemas/IvrResultCallbackDetail' }
        technical_exceptions:
          type: array
          items: { $ref: '#/components/schemas/IvrTechnicalExceptionDetail' }
        review_items:
          type: array
          items: { $ref: '#/components/schemas/IvrReviewItemDetail' }
        evidence_refs:
          type: array
          items: { type: string }
        audit_refs:
          type: array
          items: { type: string }
        correlation_id: { type: string }
        input_signal_only: { type: boolean, enum: [true] }
        no_direct_order_update: { type: boolean, enum: [true] }
    IvrScriptApproval:
      type: object
      additionalProperties: false
      required: [approval_type, actor_id, reason, correlation_id, approved_at]
      properties:
        approval_type: { type: string }
        actor_id: { type: string }
        reason: { type: string }
        correlation_id: { type: string }
        approved_at: { type: string, format: date-time }
    IvrScriptVersion:
      type: object
      additionalProperties: false
      required:
        - template_id
        - version
        - status
        - template_hash
        - allowed_input_fields
        - approvals
        - missing_approvals
        - template_valid
        - uses_production_decision_fields
        - created_by
        - created_at
      properties:
        template_id: { type: string }
        version: { type: string }
        status: { type: string }
        template_hash: { type: string }
        allowed_input_fields:
          type: array
          items: { type: string }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/IvrScriptApproval' }
        missing_approvals:
          type: array
          items: { type: string }
        template_valid:
          type: boolean
          description: False when the stored template no longer satisfies the Target V1 whitelist.
        uses_production_decision_fields: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        submitted_by: { type: string }
        submitted_at: { type: string, format: date-time }
        retired_by: { type: string }
        retired_at: { type: string, format: date-time }
    IvrDtmfKey:
      type: object
      additionalProperties: false
      required: [key, meaning, enabled]
      properties:
        key: { type: string }
        meaning: { type: string }
        enabled: { type: boolean }
    IvrScriptVersionDetail:
      type: object
      additionalProperties: false
      description: >-
        Detail projection for one version, distinct from the catalogue's
        IvrScriptVersion: it carries the template text and the derived
        approved_for_modes, which a list view neither needs nor should carry.
      required:
        - template_id
        - version
        - status
        - template_text
        - template_hash
        - allowed_input_fields
        - approvals
        - created_by
        - created_at
        - uses_production_decision_fields
        - approved_for_modes
      properties:
        template_id: { type: string, maxLength: 120 }
        version: { type: string, maxLength: 40 }
        status: { type: string, enum: [DRAFT, IN_REVIEW, APPROVED, RETIRED] }
        template_text: { type: string, maxLength: 2000 }
        template_hash: { type: string, maxLength: 128 }
        allowed_input_fields: { type: array, items: { type: string } }
        approvals: { type: array, items: { $ref: '#/components/schemas/IvrScriptApproval' } }
        created_by: { type: string, maxLength: 120 }
        created_at: { type: string, format: date-time }
        submitted_by: { type: [string, 'null'], maxLength: 120 }
        submitted_at: { type: [string, 'null'], format: date-time }
        retired_by: { type: [string, 'null'], maxLength: 120 }
        retired_at: { type: [string, 'null'], format: date-time }
        uses_production_decision_fields: { type: boolean }
        approved_for_modes:
          type: array
          items: { type: string, enum: [MOCK, LAB_REAL_SIM, PRODUCTION_REAL] }
        production_blocked_reason:
          type: [string, 'null']
          maxLength: 200
          description: >-
            The missing production precondition, named. Null once none remains. An
            empty approved_for_modes with no reason would leave an operator to guess
            whether the system is broken or Privacy/Legal simply has not signed.
    IvrScriptDraftRequest:
      type: object
      additionalProperties: false
      required: [template_id, version, template_text, reason]
      properties:
        template_id: { type: string, maxLength: 120, pattern: '^[A-Za-z0-9._-]+$' }
        version: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9._-]+$' }
        template_text: { type: string, maxLength: 2000 }
        reason: { type: string, maxLength: 500 }
    IvrScriptTransitionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    IvrScriptApprovalRequest:
      type: object
      additionalProperties: false
      required: [approval_type, reason]
      properties:
        approval_type: { type: string, enum: [MOCK_TEST, LAB, CONTENT, PRIVACY_LEGAL] }
        reason: { type: string, maxLength: 500 }
    IvrScriptActionResult:
      type: object
      additionalProperties: false
      required: [action_type, target_type, target_id, correlation_id, no_policy_bypass, version]
      properties:
        action_type: { type: string, maxLength: 80 }
        target_type: { type: string, enum: [script_version] }
        target_id: { type: string, maxLength: 200 }
        correlation_id: { type: string, maxLength: 120 }
        no_policy_bypass: { type: boolean, enum: [true] }
        version: { $ref: '#/components/schemas/IvrScriptVersionDetail' }
    IvrScriptCatalog:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - execution_mode
        - production_target_v1_fields_approved
        - allowed_input_fields
        - prohibited_variables
        - dtmf_map
        - required_approval_types
        - versions
      properties:
        generated_at: { type: string, format: date-time }
        execution_mode: { type: string }
        production_target_v1_fields_approved:
          type: boolean
          description: OD-V1-15. While false the Target V1 field set is not production approved.
        allowed_input_fields:
          type: array
          items: { type: string }
        prohibited_variables:
          type: array
          items: { type: string }
        dtmf_map:
          type: array
          items: { $ref: '#/components/schemas/IvrDtmfKey' }
        required_approval_types:
          type: array
          items: { type: string }
        versions:
          type: array
          items: { $ref: '#/components/schemas/IvrScriptVersion' }
    IvrDependencyStatus:
      type: object
      additionalProperties: false
      required: [dependency, state, detail, fail_closed_effect, observed]
      properties:
        dependency: { type: string }
        state: { type: string, enum: [UP, DOWN, READY_503, NOT_WIRED] }
        detail:
          type: string
          description: Raw diagnostic text retained for exact log/trace lookup.
        detail_vi:
          type: string
          description: >
            W-0116. Optional Vietnamese companion for interpolated telemetry. It never
            replaces detail; absence is valid during a rolling deployment from draft.16.
        fail_closed_effect: { type: string }
        observed:
          type: boolean
          description: False means IVR has no probe for this dependency yet (W-0040).
        captured_at: { type: string, format: date-time }
    IvrFailClosedEvent:
      type: object
      additionalProperties: false
      required: [source, reference, effect, correlation_id, occurred_at]
      properties:
        source: { type: string }
        reference: { type: string }
        effect: { type: string }
        hold_new_calls:
          type: boolean
          description: >
            W-0116. Present for CAPACITY_INCIDENT so the console can translate the effect
            without inferring a boolean from English prose; absent for other event sources
            and from draft.16 servers during rolling deployment.
        correlation_id: { type: string }
        occurred_at: { type: string, format: date-time }
    IvrIntegrationStatus:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - execution_mode
        - sales_provider
        - sim_provider
        - real_customer_call_allowed
        - global_dial_kill_switch
        - attempt_policy_version
        - flag_revision
        - dependency_probing_available
        - dependencies
        - recent_fail_closed_events
      properties:
        generated_at: { type: string, format: date-time }
        execution_mode: { type: string }
        sales_provider: { type: string }
        sim_provider: { type: string }
        real_customer_call_allowed: { type: boolean }
        global_dial_kill_switch: { type: boolean }
        attempt_policy_version: { type: string }
        flag_revision: { type: integer }
        dependency_probing_available:
          type: boolean
          description: False until P6-1 (W-0040); no card may be read as verified fail-closed.
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/IvrDependencyStatus' }
        recent_fail_closed_events:
          type: array
          items: { $ref: '#/components/schemas/IvrFailClosedEvent' }
    IvrReviewQueueItem:
      type: object
      additionalProperties: false
      required:
        - review_item_id
        - source_type
        - source_id
        - reason
        - status
        - correlation_id
        - created_at
      properties:
        review_item_id: { type: string }
        source_type: { type: string }
        source_id: { type: string }
        reason: { type: string }
        status: { type: string }
        resolution: { type: string }
        correlation_id: { type: string }
        ivr_call_job_id: { type: string }
        order_code_short: { type: string, maxLength: 40 }
        result_type: { type: string }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
    IvrReviewQueue:
      type: object
      additionalProperties: false
      required: [page, page_size, total_count, items]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_count: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/IvrReviewQueueItem' }
    IvrSimChannel:
      type: object
      additionalProperties: false
      required:
        - sim_channel_id
        - enabled
        - status
        - adapter_mode
        - provider_name
        - busy
        - fail_count
        - quarantined
      properties:
        sim_channel_id: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        adapter_mode: { type: string }
        provider_name: { type: string }
        busy:
          type: boolean
          description: Carrying a call; a disable then takes effect after it ends.
        active_call_job_id: { type: string }
        fail_count: { type: integer, minimum: 0 }
        quarantined: { type: boolean }
        quarantine_until: { type: string, format: date-time }
        cooldown_until: { type: string, format: date-time }
        last_health_check_at: { type: string, format: date-time }
        disabled_reason: { type: string }
    IvrSimChannelList:
      type: object
      additionalProperties: false
      required: [generated_at, execution_mode, real_customer_call_allowed, channels]
      properties:
        generated_at: { type: string, format: date-time }
        execution_mode: { type: string }
        real_customer_call_allowed: { type: boolean }
        channels:
          type: array
          items: { $ref: '#/components/schemas/IvrSimChannel' }
    IvrAnalyticsDataQuality:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - source
        - warehouse_backed
        - pipeline_work_id
        - status
        - min_bucket_size
        - suppressed_bucket_count
        - scanned_rows
        - truncated
        - warehouse_status
      properties:
        generated_at: { type: string, format: date-time }
        source:
          type: string
          description: >-
            Which store answered: ANALYTICS_WAREHOUSE once the P10-4 pipeline
            (W-0055) has loaded facts, OPERATIONAL_READ_MODEL before that.
            Deliberately not an enum — it is a diagnostic label the console
            prints rather than switches on, and a closed set here would make an
            older client fail to read a payload naming a source it predates.
            `warehouse_status` is the enum, because that one is switched on.
        warehouse_backed:
          type: boolean
          description: False means these numbers are operational reads, not a BI pipeline.
        pipeline_work_id: { type: string }
        latest_event_at: { type: string, format: date-time }
        freshness_seconds: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [FRESH, STALE, NO_DATA] }
        min_bucket_size:
          type: integer
          minimum: 1
          description: Server-side k-anonymity threshold; never settable by the caller.
        suppressed_bucket_count: { type: integer, minimum: 0 }
        scanned_rows: { type: integer, minimum: 0 }
        truncated:
          type: boolean
          description: True when the scan cap was reached, so the numbers are partial.
        warehouse_status:
          type: string
          enum: [NOT_RUN, COMPLETE, BACKLOG, MISMATCH]
          description: >-
            State of the P10-4 pipeline, reported separately from `source`.
            Serving from the warehouse and the warehouse being complete are
            different claims; BACKLOG means a real but partial answer.
    IvrAnalyticsFilter:
      type: object
      additionalProperties: false
      required: [bucket]
      properties:
        program: { type: string, enum: [GOLDEN_HOUR, TWENTY_FOUR_SEVEN] }
        result_type: { type: string, maxLength: 200 }
        script_variant: { type: string, maxLength: 200 }
        bucket: { type: string, enum: [DAY, HOUR] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
    IvrAnalyticsKpi:
      type: object
      additionalProperties: false
      required:
        - total_results
        - total_final_results
        - total_call_jobs
        - total_eligible_tasks
        - confirm_rate
        - cancel_rate
        - no_answer_rate
        - invalid_phone_rate
        - technical_rate
        - operational_blocked_rate
        - attempt_2_rate
      properties:
        total_results: { type: integer, minimum: 0 }
        total_final_results: { type: integer, minimum: 0 }
        total_call_jobs: { type: integer, minimum: 0 }
        total_eligible_tasks: { type: integer, minimum: 0 }
        confirm_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        cancel_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        no_answer_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        invalid_phone_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        technical_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        operational_blocked_rate:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 1
          description: >-
            Null until a dedicated intake-block fact source exists. It must not
            be derived from call results because pre-call blocks create no call
            result; zero would falsely mean no block occurred.
        attempt_2_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Counted customer attempts only; a technical retry never counts (DT-02).
        avg_seconds_to_final: { type: number, format: double, minimum: 0 }
    IvrAnalyticsBreakdownRow:
      type: object
      additionalProperties: false
      required: [key, total, confirmed, confirm_rate, share]
      properties:
        key: { type: string, maxLength: 200 }
        total: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        confirm_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        share: { type: number, format: double, minimum: 0, maximum: 1 }
    IvrAnalyticsTrendBucket:
      type: object
      additionalProperties: false
      required:
        - bucket_start
        - program
        - total
        - confirmed
        - cancelled
        - no_answer
        - invalid_phone
        - technical
        - operational_blocked
        - confirm_rate
      properties:
        bucket_start: { type: string, format: date-time }
        program: { type: string }
        total: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        no_answer: { type: integer, minimum: 0 }
        invalid_phone: { type: integer, minimum: 0 }
        technical: { type: integer, minimum: 0 }
        operational_blocked:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Null for the current system. Pre-call operational/policy blocks are
            not result events and therefore cannot be counted in a result trend.
        confirm_rate: { type: number, format: double, minimum: 0, maximum: 1 }
    IvrAnalyticsSummary:
      type: object
      additionalProperties: false
      required: [filter, execution_mode, kpi, result_taxonomy, data_quality]
      properties:
        filter: { $ref: '#/components/schemas/IvrAnalyticsFilter' }
        execution_mode: { type: string }
        kpi: { $ref: '#/components/schemas/IvrAnalyticsKpi' }
        result_taxonomy:
          type: array
          items: { $ref: '#/components/schemas/IvrAnalyticsBreakdownRow' }
        data_quality: { $ref: '#/components/schemas/IvrAnalyticsDataQuality' }
    IvrAnalyticsTrend:
      type: object
      additionalProperties: false
      required: [filter, buckets, data_quality]
      properties:
        filter: { $ref: '#/components/schemas/IvrAnalyticsFilter' }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/IvrAnalyticsTrendBucket' }
        data_quality: { $ref: '#/components/schemas/IvrAnalyticsDataQuality' }
    IvrAnalyticsBreakdown:
      type: object
      additionalProperties: false
      required: [filter, dimension, rows, data_quality]
      properties:
        filter: { $ref: '#/components/schemas/IvrAnalyticsFilter' }
        dimension: { type: string, enum: [RESULT_TYPE, SCRIPT_VARIANT, PROGRAM] }
        rows:
          type: array
          items: { $ref: '#/components/schemas/IvrAnalyticsBreakdownRow' }
        data_quality: { $ref: '#/components/schemas/IvrAnalyticsDataQuality' }
    IvrAnalyticsExport:
      type: object
      additionalProperties: false
      required:
        - filter
        - dimension
        - reason
        - actor_id
        - correlation_id
        - audit_ref
        - columns
        - rows
        - suppressed_row_count
        - data_quality
      properties:
        filter: { $ref: '#/components/schemas/IvrAnalyticsFilter' }
        dimension: { type: string, enum: [RESULT_TYPE, SCRIPT_VARIANT, PROGRAM] }
        reason: { type: string, minLength: 8, maxLength: 200 }
        actor_id: { type: string }
        correlation_id: { type: string }
        audit_ref:
          type: string
          description: Identifier of the audit entry written for this export.
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          description: Formatted aggregate values only; there is no object shape a customer field could travel in.
          items:
            type: array
            items: { type: string }
        suppressed_row_count: { type: integer, minimum: 0 }
        data_quality: { $ref: '#/components/schemas/IvrAnalyticsDataQuality' }
    IvrAdminActionResult:
      type: object
      additionalProperties: false
      required:
        - admin_action_id
        - action_type
        - target_type
        - target_id
        - status
        - correlation_id
        - no_policy_bypass
      properties:
        admin_action_id: { type: string }
        action_type: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        status: { type: string, enum: [APPLIED] }
        correlation_id: { type: string }
        no_policy_bypass: { type: boolean, enum: [true] }
    IvrTechnicalRetryResult:
