  /dev/integration-profiles/{profileId}:apply:
    post:
      tags: [admin]
      summary: Apply an integration-status profile (NON-PRODUCTION ONLY, perm IVR_DEV_TOOLING)
      description: >-
        Applies what IVR actually controls and reports the rest as declared
        only. SIM_GATEWAY is enforced by enabling or disabling channels through
        the ordinary admin path, so the fail-closed re-enable check still holds.
        ORDER_CORE, OPS_SELLABLE_GATE, CRM_DO_NOT_CALL and EVIDENCE_REGISTRY are
        never probed by IVR and report NOT_WIRED, so a profile cannot switch
        them; the response says which is which rather than implying five
        dependencies moved.
      operationId: applyDevIntegrationProfile
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: profileId
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: Profile applied, content: { application/json: { schema: { $ref: '#/components/schemas/IvrIntegrationProfileResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs:terminate-all:
    post:
      tags: [admin]
      summary: Cut every call currently in progress (perm IVR_CALL_TERMINATE)
      description: >-
        Its own operation rather than a side effect of engaging the kill switch.
        The kill switch stops the next call; this ends conversations already
        happening with real people, so the two take separate presses and separate
        reasons. Each cut is recorded exactly as the single-call version records
        it. 409 when nothing is running.
      operationId: terminateAllCallJobs
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: Termination requested for every live call, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /call-jobs/{ivrCallJobId}:terminate:
    post:
      tags: [admin]
      summary: Cut a call that is already in progress (perm IVR_CALL_TERMINATE)
      description: >-
        Records the request; it does not end the call. Ivr.Api holds no telephony
        gateway, so the worker's dispatch loop polls for this and performs the
        hangup. A cut is recorded as IVR_TECHNICAL_EXCEPTION with
        customer_attempt_counted false - the customer never got to answer, so
        spending one of their attempts on an operator's decision would charge
        them for it. 409 when the job has no call in progress, with nothing
        written: a refused safety action that still leaves a partial record is
        worse than one that leaves none.
      operationId: terminateCallJob
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: ivrCallJobId
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMutationRequest' } } }
      responses:
        '200': { description: Termination requested, content: { application/json: { schema: { $ref: '#/components/schemas/IvrAdminActionResult' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
